function spoonShape(){const s=new THREE.Shape();s.moveTo(-.4,-.03);s.lineTo(-.02,-.025);
  for(let t=PI+.25;t<=3*PI-.25;t+=.15)s.lineTo(.22+.2*Math.cos(t),.105*Math.sin(t));s.lineTo(-.02,.025);s.lineTo(-.4,.03);s.lineTo(-.4,-.03);return s}
function flat(shape){const g=new THREE.ExtrudeGeometry(shape,{depth:.03,bevelEnabled:false,curveSegments:14});g.rotateX(-PI/2);const m=new THREE.Mesh(g,IM);edge(m,35);return m}
function clamshell(){const g=new THREE.Group(),W=.9,D=.66,H=.2,t=.03;
  bx(g,W,t,D,IM,0,t/2,0);bx(g,W,H,t,IM,0,H/2+t,D/2-t/2);bx(g,W,H,t,IM,0,H/2+t,-D/2+t/2);
  for(const s of[-1,1])bx(g,t,H,D-2*t,IM,s*(W/2-t/2),H/2+t,0);
  const hg=new THREE.Group();hg.position.set(0,H+t,-D/2);hg.rotation.x=-PI*.62;g.add(hg);        // couvercle ouvert
  bx(hg,W,t,D,IM,0,0,D/2);bx(hg,W,.12,t,IM,0,-.06-t/2,D-t/2);for(const s of[-1,1])bx(hg,t,.12,D-2*t,IM,s*(W/2-t/2),-.06-t/2,D/2);
  return g}
item(Plate(),1.5,-1.05,Y2,.05);item(Cup(),1.5,-.1,Y2,.05);item(clamshell(),1,1.05,Y2,.05);
item(flat(forkShape()),1.5,-.8,Y1,.1,.12);item(flat(spoonShape()),1.5,.7,Y1,.1,-.1);
const shelfW=V(5.6,1.7,5.4);

/* ---------- chronologie (s) ---------- */
const prog=(t,a,b)=>Math.min(1,Math.max(0,(t-a)/(b-a))),ease=x=>x*x*(3-2*x),lerp=(a,b,t)=>a+(b-a)*t;
const TL={enter:[0,2.5],lift:[2.5,4.5],slide:[4.5,5.2],rest:[5.2,5.5],back:[5.5,6.3],drop:[6.3,6.9],show:[6.9,8.6],hold:11.3,ret:[11.3,12.4],end:13.4};
const AX=SLOT.x,Z0=4.8,ZSTAGE=-2.8,ZPLACE=SLOT.z+2.06,ZBACK=-1.6;
const C0=.3,CSLIDE=LV[2]+.14,CREST=LV[2]+.06;
const CAP=[[0,"Le chariot avance dans l'allée, palette en position basse"],[TL.lift[0],"Levée verticale de la palette vers l'étage ciblé"],[TL.slide[0],'Dépose de la palette dans le rack'],[TL.back[0],'Le chariot recule, fourches à vide'],[TL.show[0],'Mise en valeur : la gamme complète RiceWare']];
let lastCap=-1,camOff=V(0,0,0);
function frame(t){
  // trajectoire du chariot
  let z=Z0,c=C0;
  z=lerp(Z0,ZSTAGE,ease(prog(t,...TL.enter)));
  c=lerp(C0,CSLIDE,ease(prog(t,...TL.lift)));
  if(t>=TL.slide[0])z=lerp(ZSTAGE,ZPLACE,ease(prog(t,...TL.slide)));
  if(t>=TL.rest[0])c=lerp(CSLIDE,CREST,ease(prog(t,...TL.rest)));
  if(t>=TL.back[0])z=lerp(ZPLACE,ZBACK,ease(prog(t,...TL.back)));
  if(t>=TL.drop[0])c=lerp(CREST,C0,ease(prog(t,...TL.drop)));
  F.position.set(AX,0,z);
  WH.forEach((w,i)=>w.rotation.x=z/(i<2?.45:.3));
  CG.position.y=c;MI.position.y=(c-C0)*.5;
  // charge : sur les fourches, puis posée dans le rack
  const placed=t>=TL.back[0];
  const py=t>=TL.rest[0]?Math.max(LV[2],c-.06):c-.06,pz=placed?SLOT.z:z-2.06;
  LOAD.position.set(AX,py,pz);
  // caméra : mise en valeur du présentoir
  const k=ease(prog(t,...TL.show))-ease(prog(t,...TL.ret));
  camOff.copy(cam.position).sub(controls.target);
  if(!userCam){controls.target.copy(TGT0).lerp(shelfW,k);cam.position.copy(controls.target).add(camOff);cam.zoom=1+1.15*k;cam.updateProjectionMatrix()}
  // légende
  let ci=0;CAP.forEach((a,i)=>{if(t>=a[0])ci=i});if(ci!==lastCap){lastCap=ci;$('tl').textContent=CAP[ci][1]}
  $('tpf').style.width=(t/TL.end*100)+'%';
  HS[0].v.set(AX,3.0,z);HS[1].v.set(AX,py+1.3,pz);
}

/* ---------- annotations ---------- */
const HS=[
 ['Chariot élévateur','Vert et beige · opérateur casqué et masqué',[0,3,0]],
 ['Palette de cartons','Palette bois + cartons bruns empilés',[0,2,0]],
 ['Racks métalliques','Alvéoles chargées de palettes de cartons',[-4.5,6.4,-6.5]],
 ['Présentoir produits finis','Assiette, gobelet, fourchette, cuillère, barquette',[5.6,2.9,5.4]],
 ['Charpente métallique','Fermes triangulées et pannes',[0,11.8,0]]
].map(([t,s,p])=>{const b=document.createElement('button');b.className='hotspot';b.type='button';b.setAttribute('aria-label',t);
  b.innerHTML=`<span class="hr"></span><span class="hd"></span><span class="tip"><b>${t}</b><span>${s}</span></span>`;$('hs').appendChild(b);return{b,v:new THREE.Vector3(...p)}});
const tmp=V(0,0,0);
function place(){const w=innerWidth,h=innerHeight;for(const o of HS){tmp.copy(o.v);R.localToWorld(tmp);tmp.project(cam);o.b.style.left=((tmp.x+1)/2*w)+'px';o.b.style.top=((1-tmp.y)/2*h)+'px'}}

/* ---------- UI ---------- */
for(let i=0;i<18;i++){const e=document.createElement('i');e.className=i===17?'a':'v';$('bar').appendChild(e)}
const tog=(id,fn)=>$(id).onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);fn(on)};
let clk=0,playing=true,spd=1;
tog('bPlay',on=>{playing=on;$('bPlay').textContent=on?'Pause':'Lecture'});
tog('bSpd',on=>{spd=on?2:1;$('bSpd').textContent=on?'Vitesse ×1':'Vitesse ×2'});
tog('bAnn',on=>HS.forEach(o=>o.b.classList.toggle('off',!on)));
tog('bRot',on=>controls.autoRotate=on);
$('bRep').onclick=()=>{clk=0;userCam=false};
$('bRes').onclick=reset;
$('bPng').onclick=()=>{renderer.render(scene,cam);const a=document.createElement('a');a.href=renderer.domElement.toDataURL('image/png');a.download='riceware-etape18-stockage.png';a.click()};
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')reset();if(e.code==='Space'){e.preventDefault();$('bPlay').click()}});
reset();
let vis=true;document.addEventListener('visibilitychange',()=>vis=!document.hidden);
if(matchMedia('(prefers-reduced-motion: reduce)').matches)clk=TL.show[1];
let last=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;if(!vis)return;
  if(playing){clk+=dt*spd;if(clk>TL.end){clk=0;userCam=false}}
  frame(clk);controls.update();renderer.render(scene,cam);place()})(last);
setTimeout(()=>$('ld').classList.add('h'),400);
</script>
