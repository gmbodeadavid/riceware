const UPV=new THREE.Vector3(0,1,0);
function mkArm(){const o={};const r=(rad,mat)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(1,1,1,12),mat);m.userData.r=rad;R.add(m);return m};
  o.u=r(.085,SHIRT);o.f=r(.075,SHIRT);o.sh=sp(R,.105,VEST,0,0,0);o.el=sp(R,.085,SHIRT,0,0,0);o.h=sp(R,.1,GLOVE,0,0,0);return o}
function setRod(m,a,b){const d=b.clone().sub(a),L=d.length();m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(UPV,d.normalize());m.scale.set(m.userData.r,L,m.userData.r)}
function armUpdate(o,sh,hand,hint){
  const l=.52,d=hand.clone().sub(sh),L=d.length(),h=Math.sqrt(Math.max(.01,l*l-(L/2)**2)),n=d.clone().normalize();
  const p=hint.clone().sub(n.clone().multiplyScalar(hint.dot(n))).normalize();
  const el=sh.clone().add(hand).multiplyScalar(.5).add(p.multiplyScalar(h));
  o.sh.position.copy(sh);o.el.position.copy(el);o.h.position.copy(hand);setRod(o.u,sh,el);setRod(o.f,el,hand)}
const armR=mkArm(),armL=mkArm();
function shadow(x,z,rx,rz,o=.16){const m=new THREE.Mesh(new THREE.CircleGeometry(1,40),new THREE.MeshBasicMaterial({color:0x6e6648,transparent:true,opacity:o,depthWrite:false}));m.rotation.x=-PI/2;m.scale.set(rx,rz,1);m.position.set(x,.004,z);R.add(m);return m}
shadow(0,0,1.75,1.45);const opShadow=shadow(0,0,.65,.5,.2);

/* ---------- chronologie (secondes) ---------- */
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const P0=V(3.7,0,3.1),P1=V(1.1,0,1.65),P2=V(.01,0,1.65),P3=P0.clone();
const L1=P0.distanceTo(P1),L2=P1.distanceTo(P2),L3=P2.distanceTo(P3);
const TT={enter:5.6,stack:6.4,s1:[6.6,8.3],s2:[8.1,9.8],in1:[10,10.7],pump1:[10.7,16.7],crimp1:16.7,out1:[17.3,17.9],walk2:[17.9,20.9],in2:[21,21.7],pump2:[21.7,27.7],crimp2:27.7,out2:[28.3,28.9],exit:[29.2,34],end:36};
const prog=(t,a,b)=>Math.min(1,Math.max(0,(t-a)/(b-a)));
const ease=x=>x*x*(3-2*x),outC=x=>1-Math.pow(1-x,3);
function tens(t,a,b){if(t<=a)return 0;if(t>=b)return 1;const c=(t-a)/(b-a)*6,f=Math.floor(c);return Math.min(1,(f+ease(Math.min(1,(c-f)*1.7)))/6)}
function opPos(t){
  const e1=prog(t,0,TT.enter),e2=prog(t,TT.walk2[0],TT.walk2[1]),e3=prog(t,TT.exit[0],TT.exit[1]),a=ease(e1),b=ease(e2),c=ease(e3);
  let p,mv,dir;
  if(t<TT.walk2[0]){p=P0.clone().lerp(P1,a);mv=e1>0&&e1<1;dir=P1.clone().sub(P0)}
  else if(t<TT.exit[0]){p=P1.clone().lerp(P2,b);mv=e2>0&&e2<1;dir=P2.clone().sub(P1)}
  else{p=P2.clone().lerp(P3,c);mv=e3>0&&e3<1;dir=P3.clone().sub(P2)}
  return{p,mv,dir,len:a*L1+b*L2+c*L3}}
const CAP=[[0,'Empilage des cartons plats sur la palette'],[TT.stack,'Passage des deux sangles noires autour de la pile'],[TT.s2[1]+.1,'Sangle n°1 : tension au tendeur manuel'],[TT.out1[1],'Déplacement vers la sangle n°2'],[TT.in2[0],'Sangle n°2 : tension au tendeur manuel'],[TT.out2[1],'Palette cerclée, prête pour le stockage']];
let yaw=0,amp=0,lastCap=-1;

function frame(t,dt,snap){
  // 1. empilage
  layers.forEach((m,i)=>{const u=prog(t,.3+i*.27,.8+i*.27);m.visible=u>0;m.position.y=m.userData.y+(1-outC(u))*3.4});
  label.visible=t>TT.stack;
  // 2. sangles
  const d1=ease(prog(t,TT.s1[0],TT.s1[1])),d2=ease(prog(t,TT.s2[0],TT.s2[1]));
  strapA.material.userData.u.value=d1>=1?1.01:d1;strapB.material.userData.u.value=d2>=1?1.01:d2;
  strapA.children[0].visible=d1>=1;strapB.children[0].visible=d2>=1;
  const tA=tens(t,TT.pump1[0],TT.pump1[1]),tB=tens(t,TT.pump2[0],TT.pump2[1]);
  strapA.material.color.copy(SLACK).lerp(TAUT,tA);strapB.material.color.copy(SLACK).lerp(TAUT,tB);
  // 3. outil
  const act=t<TT.out1[1]?1:2,xc=act===1?SXR:SXL;
  const pr=act===1?ease(prog(t,TT.in1[0],TT.in1[1]))*(1-ease(prog(t,TT.out1[0],TT.out1[1]))):ease(prog(t,TT.in2[0],TT.in2[1]))*(1-ease(prog(t,TT.out2[0],TT.out2[1])));
  const ps=act===1?TT.pump1:TT.pump2,pumping=t>=ps[0]&&t<=ps[1];
  const pa=pumping?(1-Math.cos(2*PI*(t-ps[0])))/2:0;
  TG.visible=pr>.001;TG.position.set(xc,1.35,ZO+(1-pr)*.5);LG.rotation.x=pumping?-.35+.9*pa:-.2;
  // 4. opérateur
  const o=opPos(t),ph=o.len*3.6;
  amp+=((o.mv?1:0)-amp)*Math.min(1,dt*10);
  legR.rotation.x=Math.sin(ph)*.55*amp;legL.rotation.x=-Math.sin(ph)*.55*amp;
  G.position.copy(o.p);G.position.y=Math.abs(Math.sin(ph))*.04*amp;
  let ty;if(o.mv)ty=Math.atan2(-o.dir.x,-o.dir.z);else ty=Math.atan2(-(xc-o.p.x),-(ZO-o.p.z));
  const dd=((ty-yaw+PI*3)%(PI*2))-PI;yaw=snap?ty:yaw+dd*(1-Math.exp(-dt*8));G.rotation.y=yaw;
  opShadow.position.set(o.p.x+.1,.004,o.p.z+.1);
  G.updateMatrix();scene.updateMatrixWorld(true);
  const toR=v=>v.clone().applyMatrix4(G.matrix);
  const le=R.worldToLocal(LG.localToWorld(LEVER_TIP.clone()));
  const sw=Math.sin(ph)*.28*amp,w=ease(pr);
  const freeR=toR(V(.46,1.0,-.1+sw)),freeL=toR(V(-.46,1.0,-.1-sw));
  const bodyT=V(TG.position.x,TG.position.y,TG.position.z+.21);
  armUpdate(armR,toR(V(.4,1.78,0)),freeR.lerp(bodyT,w),V(.5,-1,-.3).applyQuaternion(G.quaternion));
  armUpdate(armL,toR(V(-.4,1.78,0)),freeL.lerp(le,w),V(-.5,-1,-.3).applyQuaternion(G.quaternion));
  // 5. agrafes (sertissage)
  for(const [m,c] of[[sealA,TT.crimp1],[sealB,TT.crimp2]]){const u=ease(prog(t,c,c+.25));m.visible=u>.01;m.scale.setScalar(Math.max(.01,u));m.material.emissive.setScalar(Math.max(0,1-prog(t,c,c+.8))*.7)}
  // 6. jauge + légende
  const gOn=(t>=TT.in1[0]&&t<TT.out1[1])||(t>=TT.in2[0]&&t<TT.out2[1]);
  $('gauge').classList.toggle('on',gOn);
  if(gOn){const tv=act===1?tA:tB,sealed=(act===1?t>TT.crimp1:t>TT.crimp2);const pct=Math.round(tv*100);
    $('gl').textContent=`Sangle n°${act}`+(sealed?' · sertie ✓':' · tension');$('gf').style.width=pct+'%';$('gp').textContent=pct+' %'}
  let ci=0;CAP.forEach((c,i)=>{if(t>=c[0])ci=i});if(ci!==lastCap){lastCap=ci;$('tl').textContent=CAP[ci][1]}
  $('tpf').style.width=(t/TT.end*100)+'%';
  // 7. annotations mobiles
  HS[3].v.set(TG.position.x,TG.position.y+.1,TG.position.z+.2);HS[3].b.style.visibility=TG.visible?'visible':'hidden';
  HS[4].v.set(o.p.x,2.75,o.p.z);
}

/* ---------- annotations ---------- */
const HS=[
 ['Palette en bois','Semelles, tasseaux et plateau, posés à plat',[0,.15,1.0]],
 ['Pile de cartons plats','20 couches de cartons beiges',[-.7,1.9,.97]],
 ['Sangles de cerclage','2 sangles noires qui épousent la pile',[-.545,YT+.1,.5]],
 ['Outil de cerclage manuel','Tendeur à levier',[SXR,1.45,ZO+.2]],
 ['Opérateur','Casque jaune, masque blanc, gilet gris à bandes vertes',[1.1,2.75,1.65]]
].map(([t,s,p])=>{const b=document.createElement('button');b.className='hotspot';b.type='button';b.setAttribute('aria-label',t);
  b.innerHTML=`<span class="hr"></span><span class="hd"></span><span class="tip"><b>${t}</b><span>${s}</span></span>`;$('hs').appendChild(b);return{b,v:new THREE.Vector3(...p)}});
const tmp=new THREE.Vector3();
function place(){const w=innerWidth,h=innerHeight;for(const o of HS){tmp.copy(o.v);R.localToWorld(tmp);tmp.project(cam);o.b.style.left=((tmp.x+1)/2*w)+'px';o.b.style.top=((1-tmp.y)/2*h)+'px'}}

/* ---------- UI ---------- */
for(let i=0;i<18;i++){const e=document.createElement('i');e.className=i===16?'a':(i<16?'v':'');$('bar').appendChild(e)}
const tog=(id,fn)=>$(id).onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);fn(on)};
tog('bCard',on=>$('card').classList.toggle('off',!on));
tog('bAnn',on=>HS.forEach(o=>o.b.classList.toggle('off',!on)));
tog('bRot',on=>controls.autoRotate=on);
let clk=0,playing=true,spd=1,snap=true;
tog('bPlay',on=>{playing=on;$('bPlay').textContent=on?'Pause':'Lecture'});
tog('bSpd',on=>{spd=on?2:1;$('bSpd').textContent=on?'Vitesse ×1':'Vitesse ×2'});
$('bRep').onclick=()=>{clk=0;snap=true};
$('cardX').onclick=()=>{$('card').classList.add('off');$('bCard').setAttribute('aria-pressed','false')};
$('bRes').onclick=reset;
$('bPng').onclick=()=>{renderer.render(scene,cam);const a=document.createElement('a');a.href=renderer.domElement.toDataURL('image/png');a.download='riceware-etape17-emballage.png';a.click()};
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')reset();if(e.code==='Space'){e.preventDefault();$('bPlay').click()}});

reset();
let vis=true;document.addEventListener('visibilitychange',()=>vis=!document.hidden);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduced){clk=TT.end-1}
let last=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;if(!vis)return;
  if(playing){clk+=dt*spd;if(clk>TT.end){clk=0;snap=true}}
  frame(clk,dt*spd,snap);snap=false;controls.update();renderer.render(scene,cam);place()})(last);
setTimeout(()=>$('ld').classList.add('h'),300);
</script>
</body>
