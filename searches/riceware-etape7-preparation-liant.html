<style>
:root{--bg:#F4F1E4;--ink:#1C2A20;--paper:#FFFDF6;--line:#DDD6BF;--green:#2E7D5B;--amber:#D3A61F;--ease:cubic-bezier(.2,.8,.2,1)}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const $=id=>document.getElementById(id), V=(x,y,z)=>new THREE.Vector3(x,y,z);

/* ---------- rendu ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
const PR=Math.min(devicePixelRatio,2);renderer.setPixelRatio(PR);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor(0,0);
$('cv').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
const cam=new THREE.OrthographicCamera(-1,1,1,-1,-300,400);
const HOME=V(26,21,26),TGT=V(-.2,2.4,.2);
cam.position.copy(HOME);
const controls=new OrbitControls(cam,renderer.domElement);
controls.target.copy(TGT);controls.enableDamping=true;controls.dampingFactor=.08;
controls.maxPolarAngle=1.45;controls.minZoom=.55;controls.maxZoom=3.2;controls.autoRotateSpeed=.8;
controls.addEventListener('start',()=>$('hint').style.opacity=0);
function fit(){const w=innerWidth,h=innerHeight,a=w/h,hh=a<1.7?8.6*1.7/a:8.6;
  cam.left=-hh*a;cam.right=hh*a;cam.top=hh;cam.bottom=-hh;cam.updateProjectionMatrix();renderer.setSize(w,h)}
addEventListener('resize',fit);fit();

/* ---------- lumières ---------- */
scene.add(new THREE.HemisphereLight(0xfff4e0,0xcfc6ac,.6));
const sun=new THREE.DirectionalLight(0xfff0d8,2.6);sun.position.set(-12,24,16);sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096);Object.assign(sun.shadow.camera,{left:-15,right:15,top:15,bottom:-15,near:1,far:80});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;sun.shadow.radius=5;scene.add(sun);
const fill=new THREE.DirectionalLight(0xcfe0ff,.6);fill.position.set(20,10,-8);scene.add(fill);

/* ---------- textures procédurales ---------- */
let seed=13;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function ctex(w,h,fn,rx=1,ry=1,srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=8;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t}
const concrete=(rx,ry)=>ctex(256,256,(g,w,h)=>{g.fillStyle='#d3cebf';g.fillRect(0,0,w,h);
  for(let i=0;i<5000;i++){const v=rnd()>.5?255:60;g.fillStyle=`rgba(${v},${v},${v},${.05+rnd()*.07})`;g.fillRect(rnd()*w,rnd()*h,1+rnd()*2,1+rnd()*2)}},rx,ry);
const plate=(rx,ry,srgb=true)=>ctex(64,64,(g,w,h)=>{g.fillStyle='#8f959b';g.fillRect(0,0,w,h);g.fillStyle='#c4c9ce';
  [[16,16,1],[48,48,1],[48,16,-1],[16,48,-1]].forEach(([x,y,s])=>{g.save();g.translate(x,y);g.rotate(s*Math.PI/4);g.fillRect(-9,-2.5,18,5);g.restore()})},rx,ry,srgb);
const brushed=(rx,ry)=>ctex(256,256,(g,w,h)=>{g.fillStyle='#b9bfc5';g.fillRect(0,0,w,h);
  for(let i=0;i<1100;i++){g.fillStyle=rnd()>.5?`rgba(255,255,255,${.04+rnd()*.07})`:`rgba(0,0,0,${.04+rnd()*.07})`;g.fillRect(0,rnd()*h,w,.6+rnd()*1.4)}},rx,ry);
const woodTex=(rx,ry)=>ctex(256,256,(g,w,h)=>{g.fillStyle='#a77b4f';g.fillRect(0,0,w,h);
  for(let i=0;i<140;i++){const y=rnd()*h;g.fillStyle=rnd()>.5?`rgba(90,55,25,${.1+rnd()*.2})`:`rgba(220,175,120,${.08+rnd()*.15})`;g.fillRect(0,y,w,.8+rnd()*2.2)}
  for(let i=0;i<5;i++){const x=rnd()*w,y=rnd()*h;g.fillStyle='rgba(70,40,18,.35)';g.beginPath();g.ellipse(x,y,9,4,0,0,6.3);g.fill()}},rx,ry);
const swirlTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#f6f2e6';g.fillRect(0,0,w,h);g.translate(128,128);
  for(let k=0;k<4;k++){g.strokeStyle=`rgba(210,200,175,${.45})`;g.lineWidth=7;g.beginPath();for(let a=0;a<12;a+=.1){const r=6+a*10;g.lineTo(Math.cos(a+k*1.57)*r,Math.sin(a+k*1.57)*r)}g.stroke()}
  for(let i=0;i<500;i++){g.fillStyle=`rgba(255,255,255,${.3+rnd()*.4})`;const a=rnd()*6.28,r=rnd()*125;g.beginPath();g.arc(Math.cos(a)*r,Math.sin(a)*r,1+rnd()*3,0,6.3);g.fill()}});
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.6,metalness:0,envMapIntensity:.6,...o});
const glassMat=(o={})=>new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:0,roughness:.1,transmission:.9,thickness:.08,ior:1.45,envMapIntensity:1.4,clearcoat:1,clearcoatRoughness:.05,side:THREE.DoubleSide,...o});

/* ---------- helpers ---------- */
const sh=m=>{m.castShadow=m.receiveShadow=true;return m};
const box=(w,h,d,mat,x=0,y=0,z=0,p)=>{const m=sh(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat));m.position.set(x,y,z);p&&p.add(m);return m};
const rbox=(w,h,d,r,mat,x=0,y=0,z=0,p)=>{const m=sh(new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,r),mat));m.position.set(x,y,z);p&&p.add(m);return m};
const cyl=(rt,rb,h,seg,mat,x=0,y=0,z=0,p,rot)=>{const m=sh(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat));m.position.set(x,y,z);if(rot)m.rotation.set(...rot);p&&p.add(m);return m};
const sph=(r,mat,x,y,z,p)=>{const m=sh(new THREE.Mesh(new THREE.SphereGeometry(r,20,14),mat));m.position.set(x,y,z);p&&p.add(m);return m};
const lathe=(pts,mat,seg=40)=>sh(new THREE.Mesh(new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg),mat));
function tube(pts,r,mat,p,seg=60){const c=new THREE.CatmullRomCurve3(pts);const m=sh(new THREE.Mesh(new THREE.TubeGeometry(c,seg,r,12,false),mat));p&&p.add(m);return m}

/* ---------- matériaux ---------- */
const bt=brushed(3,3);
const steel=M(0xc6ccd0,{metalness:.92,roughness:.3,envMapIntensity:1.2,map:bt,bumpMap:bt,bumpScale:.5});
const steelD=steel.clone();steelD.side=THREE.DoubleSide;
const frameM=M(0x6d7882,{metalness:.75,roughness:.38,envMapIntensity:1});
const darkM=M(0x30363c,{metalness:.7,roughness:.5,envMapIntensity:.9});
const rubber=M(0x15171a,{roughness:.9});
const yel=M(0xf2c230,{roughness:.5}),redM=M(0xc0261c,{roughness:.45});
const wood=M(0xffffff,{map:woodTex(2,1),roughness:.7,envMapIntensity:.5});
const woodD=M(0xffffff,{map:woodTex(1,2),roughness:.75,envMapIntensity:.5});

/* ---------- cadrans (thermomètre / manomètre) ---------- */
function mkDial(){const c=document.createElement('canvas');c.width=c.height=256;const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return {g:c.getContext('2d'),t}}
function drawDial(d,min,max,val,title,unit,step,redFrom){const g=d.g,a0=Math.PI*.75,a1=Math.PI*2.25,cx=128,cy=128;
  g.clearRect(0,0,256,256);g.fillStyle='#f8f8f3';g.beginPath();g.arc(cx,cy,126,0,7);g.fill();
  g.strokeStyle='#d33';g.lineWidth=9;g.beginPath();const ra=a0+(a1-a0)*(redFrom-min)/(max-min);g.arc(cx,cy,96,ra,a1);g.stroke();
  g.fillStyle='#111';g.strokeStyle='#111';g.textAlign='center';g.textBaseline='middle';
  const n=Math.round((max-min)/step);
  for(let i=0;i<=n*5;i++){const a=a0+(a1-a0)*i/(n*5),maj=i%5===0,r1=maj?98:104;g.lineWidth=maj?3:1.5;g.beginPath();g.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);g.lineTo(cx+Math.cos(a)*112,cy+Math.sin(a)*112);g.stroke();
    if(maj){g.font='700 17px Arial';g.fillText(String(min+i/5*step),cx+Math.cos(a)*80,cy+Math.sin(a)*80)}}
  g.font='700 18px Arial';g.fillText(title,cx,168);g.font='600 15px Arial';g.fillText(unit,cx,190);
  const a=a0+(a1-a0)*Math.max(0,Math.min(1,(val-min)/(max-min)));
  g.strokeStyle='#c01818';g.lineWidth=4;g.beginPath();g.moveTo(cx-Math.cos(a)*16,cy-Math.sin(a)*16);g.lineTo(cx+Math.cos(a)*92,cy+Math.sin(a)*92);g.stroke();
  g.fillStyle='#222';g.beginPath();g.arc(cx,cy,9,0,7);g.fill();d.t.needsUpdate=true}
function makeGauge(d,R){ // face vers +z
  const g=new THREE.Group();
  cyl(R+.03,R+.03,.1,32,steel,0,0,-.05,g,[Math.PI/2,0,0]);
  const ring=sh(new THREE.Mesh(new THREE.TorusGeometry(R+.02,.02,10,40),steel));ring.position.z=.0;g.add(ring);
  const f=new THREE.Mesh(new THREE.CircleGeometry(R,40),new THREE.MeshBasicMaterial({map:d.t,toneMapped:false}));f.position.z=.002;g.add(f);
  const gl=new THREE.Mesh(new THREE.CircleGeometry(R,40),glassMat({side:THREE.FrontSide}));gl.position.z=.02;g.add(gl);
  return g}
const dT=mkDial(),dP=mkDial();drawDial(dT,0,120,80,'TEMP','°C',20,100);drawDial(dP,0,6,1.8,'PRESSION','bar',1,4.5);

/* ================= GROUPES ================= */
const world=new THREE.Group();scene.add(world);
const G_site=new THREE.Group();world.add(G_site);
const VX=2.7,VZ=-1.2,VR=1.3,TBX=-3.2,TBZ=1.4,WKX=.7,WKZ=1.5;

/* ---- site ---- */
box(15.8,.4,15.8,M(0x9a9585,{roughness:.9}),0,-.58,0,G_site);
box(15,.4,15,M(0xd3cebf,{roughness:.88,map:concrete(5,5)}),0,-.2,0,G_site);
{const lm=(w,d,x,z)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),yel);m.rotation.x=-Math.PI/2;m.position.set(x,.008,z);m.receiveShadow=true;G_site.add(m)};
 lm(.12,9.6,-6.1,0);lm(.12,9.6,.5,0)}
{const gr=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.8),M(0x7d8389,{metalness:.8,roughness:.45,map:plate(3,3),bumpMap:plate(3,3,false),bumpScale:1}));gr.rotation.x=-Math.PI/2;gr.position.set(VX-.4,.01,VZ+3.1);gr.receiveShadow=true;G_site.add(gr)}

/* ================= INGREDIENTS GROUP ================= */
function createIngredientsGroup(){
  const g=new THREE.Group();g.position.set(TBX,0,TBZ);
  // planche en bois sur tréteaux
  rbox(3.3,.12,1.7,.03,wood,0,.94,0,g);
  [-1,1].forEach(sx=>[-1,1].forEach(sz=>box(.12,.88,.12,woodD,sx*1.45,.44,sz*.7,g)));
  rbox(2.95,.06,1.3,.02,woodD,0,.3,0,g);box(3.0,.08,.08,woodD,0,.78,.7,g);box(3.0,.08,.08,woodD,0,.78,-.7,g);
  // sacs sous la table
  [[-.8,.1,0],[.1,.1,.1]].forEach(([x,y,z],i)=>rbox(.8,.3,.5,.1,M(0xe3d3ae,{roughness:.9}),x,.36+.15,z,g));
  // --- sac Cassava Starch
  const bagTex=ctex(256,340,(c,w,h)=>{c.fillStyle='#dac49c';c.fillRect(0,0,w,h);for(let i=0;i<2500;i++){c.fillStyle=`rgba(120,90,50,${rnd()*.08})`;c.fillRect(rnd()*w,rnd()*h,2,2)}
    c.fillStyle='#2E7D5B';c.fillRect(0,60,w,70);c.fillStyle='#F4F1E4';c.font='700 34px "Bricolage Grotesque",Arial';c.textAlign='center';c.textBaseline='middle';c.fillText('CASSAVA STARCH',w/2,96);
    c.fillStyle='#2b2418';c.font='700 22px Arial';c.fillText('AMIDON DE MANIOC',w/2,170);c.font='600 18px Arial';c.fillText('Qualité industrielle',w/2,198);
    c.font='700 54px "Bricolage Grotesque",Arial';c.fillText('25 kg',w/2,262);
    c.strokeStyle='#2E7D5B';c.lineWidth=5;c.beginPath();c.moveTo(40,320);c.lineTo(216,320);c.stroke()});
  const bag=new THREE.Group();bag.position.set(-1.05,1.0,-.05);bag.rotation.y=.12;g.add(bag);
  rbox(.82,1.0,.42,.14,M(0xdac49c,{roughness:.9}),0,.5,0,bag);
  box(.76,.1,.36,M(0xcdb68a,{roughness:.9}),0,1.02,0,bag);                        // pli du haut
  const bf=new THREE.Mesh(new THREE.PlaneGeometry(.7,.9),new THREE.MeshStandardMaterial({map:bagTex,roughness:.9,transparent:false}));bf.position.set(0,.5,.217);bag.add(bf);
  box(.7,.025,.03,M(0x5a4a30),0,.96,.215,bag);
  // --- pichet d'eau translucide
  const pit=new THREE.Group();pit.position.set(.15,1.0,.35);g.add(pit);
  const pg=[[0,0],[.2,0],[.23,.04],[.25,.3],[.22,.52],[.2,.6],[.21,.62],[.19,.63],[.18,.6],[.2,.52],[.23,.3],[.21,.05],[0,.03]];
  const pm=lathe(pg,glassMat({transmission:.9,roughness:.1}),48);pm.castShadow=false;pit.add(pm);
  const wt=lathe([[0,.04],[.205,.05],[.23,.3],[.215,.44],[0,.44]],glassMat({color:0xb9ddf5,transmission:.9,roughness:.05,ior:1.33,thickness:.2}),40);wt.castShadow=false;pit.add(wt);
  const hd=sh(new THREE.Mesh(new THREE.TorusGeometry(.14,.022,10,32,Math.PI),glassMat({thickness:.04})));hd.position.set(.2,.3,0);hd.rotation.set(0,0,-Math.PI/2);hd.castShadow=false;pit.add(hd);
  // --- deux tubercules de manioc
  const barkTex=ctex(128,256,(c,w,h)=>{c.fillStyle='#7b5230';c.fillRect(0,0,w,h);for(let i=0;i<60;i++){c.fillStyle=`rgba(${rnd()>.5?'50,30,12':'160,115,70'},${.15+rnd()*.25})`;c.fillRect(0,rnd()*h,w,1+rnd()*3)}});
  const root=(len,x,z,ry,tilt)=>{const rg=new THREE.Group();rg.position.set(x,1.0+.14,z);rg.rotation.set(0,ry,Math.PI/2+tilt);g.add(rg);
    const geo=new THREE.LatheGeometry([[0,0],[.12,0],[.14,.15],[.15,.4],[.12,.65],[.07,.85],[.02,.98],[0,1]].map(p=>new THREE.Vector2(p[0],p[1])),28);
    const pp=geo.attributes.position;for(let i=0;i<pp.count;i++){const y=pp.getY(i);if(y>.02){const n=1+.06*Math.sin(i*1.7+y*9);pp.setX(i,pp.getX(i)*n);pp.setZ(i,pp.getZ(i)*n);pp.setY(i,y+.02*Math.sin(i*.9))}}geo.computeVertexNormals();
    const m=sh(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:barkTex,roughness:.85,flatShading:true})));m.scale.set(1,len,1);rg.add(m);
    const cut=new THREE.Mesh(new THREE.CircleGeometry(.118,24),M(0xf3ecd8,{roughness:.6}));cut.rotation.x=Math.PI/2;cut.position.y=-.004;rg.add(cut);
    sh(cut);return rg};
  root(.95,-.35,-.42,.35,.0);root(.8,.2,-.62,-.15,0);
  // tranches de manioc

const lerp=(a,b,t)=>a+(b-a)*t,cl=(x,a,b)=>Math.min(b,Math.max(a,x)),sstep=(a,b,x)=>{x=cl((x-a)/(b-a),0,1);return x*x*(3-2*x)};

  const speed=.35+.75*sstep(5,10,t)+.4*sstep(10,13,t)-.4*sstep(18,20,t)-.9*sstep(23.5,26,t);
  const temp=25+3*sstep(0,5,t)+54*sstep(9,18,t)-10*sstep(23.5,26.5,t);
  return {level:Math.max(.02,level),speed,temp,pres:1+.9*cl((temp-28)/54,0,1),milk:sstep(5.5,17,t)*(1-sstep(25,26.5,t)),

const dm=new THREE.Object3D();let cT=0,lastPh=-1,lastLab='';

  const s=cycleState(t),h=LH*s.level,surf=LB+h;

  // eau
  waterStream.visible=s.water>.01&&surf<2.9;if(waterStream.visible){const L=2.9-surf;waterStream.scale.set(1+.15*Math.sin(t*30),L,1+.15*Math.sin(t*30));waterStream.position.y=surf+L/2;waterStream.material.opacity=.55*s.water}
  // poudre
  for(let i=0;i<70;i++){const p=(pw[i].o+t*1.5)%1,y=2.64-p*(2.64-surf);dm.position.set(FX+pw[i].dx*(1+p*3),y,FZ+pw[i].dz*(1+p*3));dm.rotation.set(0,0,0);dm.scale.setScalar(s.powder>.01&&y>surf+.02?s.powder:.0001);dm.updateMatrix();powderIM.setMatrixAt(i,dm.matrix)}

const bar=$('bar');for(let i=0;i<18;i++){const e=document.createElement('i');if(i<7)e.className='a';bar.appendChild(e)}

/* ---------- boucle ---------- */
let last=performance.now()/1000,dialT=0;const tmp=V(0,0,0);
function loop(){requestAnimationFrame(loop);const n=performance.now()/1000,dt=Math.min(.05,n-last);last=n;
  cT=(cT+dt)%CYC;const s=applyCycle(cT,dt);
  dialT+=dt;if(dialT>.2){dialT=0;drawDial(dT,0,120,s.temp+.4*Math.sin(n*3),'TEMP','°C',20,100);drawDial(dP,0,6,s.pres+.04*Math.sin(n*2),'PRESSION','bar',1,4.5);
    const lab='Phase '+(s.ph+1)+'/5 · '+PHN[s.ph]+' · '+Math.round(s.temp)+' °C';if(lab!==lastLab){lastLab=lab;$('tl').textContent=lab}}
  person.rotation.y=1.75+Math.sin(n*.45)*.07;person.position.y=Math.sin(n*1.6)*.004;
  controls.update();renderer.render(scene,cam);
  HS.forEach((h,i)=>{tmp.set(h[2],h[3],h[4]).project(cam);const nd=hsNodes[i];nd.style.left=((tmp.x+1)/2*innerWidth)+'px';nd.style.top=((1-tmp.y)/2*innerHeight)+'px'})}
loop();setTimeout(()=>$('ld').classList.add('h'),400);
</script>
