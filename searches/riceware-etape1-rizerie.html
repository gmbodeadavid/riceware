const T={
  stucco:ctex(512,(g,s)=>{g.fillStyle='#e8dcbc';g.fillRect(0,0,s,s);speckle(g,s,6000,['rgba(120,100,60,.06)','rgba(255,255,245,.09)','rgba(90,80,50,.05)'],.5,2.2);

function add(p,geo,mat,pos=[0,0,0],rot=[0,0,0],cast=true){const m=new THREE.Mesh(geo,mat);m.position.set(...pos);m.rotation.set(...rot);m.castShadow=cast;m.receiveShadow=true;p.add(m);return m}

/* ---------- socle ---------- */
const plate=slab(34,26,1.0,.22,M.plateTop,M.plateSide);plate.position.y=-1;root.add(plate);

/* ---------- rizière (arrière-plan) ---------- */
{
  const f=slab(31.5,4.6,.8,.14,M.mud,M.soilSide);f.position.set(0,0,-9.5);root.add(f);
  const blade=()=>{const parts=[];for(let i=0;i<6;i++){const g=new THREE.ConeGeometry(.045,.62+rnd()*.25,4,1);g.translate(0,.33,0);g.rotateZ((rnd()-.5)*.9);g.rotateY(i*1.05+rnd()*.4);parts.push(g)}return mergeGeometries(parts)};

/* ---------- bâtiment principal ---------- */
const B=new THREE.Group();B.position.set(-4,0,-2);root.add(B);
const BL=9,BD=7,BH=6.4,FL=3.3;

box(B,BL,.6,.4,M.cream,[0,2.7+.3,zf-.2]);
for(const [x,w] of [[-4.05,.9],[0,2],[4.05,.9]])box(B,w,2.7,.4,M.cream,[x,1.35,zf-.2]);
// soubassement

box(B,BL+.12,.5,BD-.34,M.creamDk,[0,.25,-.17-.0],[0,0,0]).scale.z=1;

box(B,BL+.14,.22,BD+.14,M.band,[0,FL,0]);

  const gt=new THREE.Mesh(new THREE.ExtrudeGeometry(tri,{depth:BL,bevelEnabled:false}),M.cream);gt.rotation.y=Math.PI/2;gt.position.set(-BL/2,BH,0);gt.castShadow=true;B.add(gt);
  // lanterneaux / aérateurs
  for(const x of[-2.2,1.8]){cyl(B,.26,.3,.3,M.steel,[x,BH+1.9+.3,0],20);const s=add(B,new THREE.SphereGeometry(.44,28,18),M.steel,[x,BH+1.9+.75,0]);s.scale.y=.85;tor(B,.44,.025,M.steel,[x,BH+1.9+.75,0],[Math.PI/2,0,0],32)}
  // évent de pignon
  const vg=new THREE.Group();vg.position.set(-BL/2-.02,BH+.85,0);B.add(vg);
  tor(vg,.46,.05,M.white,[0,0,0],[0,Math.PI/2,0]);cyl(vg,.44,.44,.04,M.dark,[0,0,0],32,[0,0,Math.PI/2]);
  for(let k=-3;k<=3;k++)box(vg,.08,.05,Math.sqrt(Math.max(0,.42*.42-(k*.13)**2))*2,M.white,[.03,k*.13,0]);

// descentes d'eau
for(const x of[-4.3,4.3])cyl(B,.06,.06,BH-.4,M.pipe,[x,(BH-.4)/2+.1,zf+.12],12);
// échelle latérale avec crinoline
{
  const g=new THREE.Group();g.position.set(-BL/2-.22,0,2.6);B.add(g);
  for(const s of[-1,1]){box(g,.05,6.1,.05,M.frameSteel,[0,3.25,s*.25])}

  box(g,.9,.06,.9,M.frameSteel,[-.35,6.25,0]);

}

/* ---------- silos + tuyauterie ---------- */
const S=new THREE.Group();root.add(S);
const SZ=-2,YB=3.6,HB=6.3,RR=1.3,SX=[4.7,7.9,11.1];
function silo(cx,ladder){
  const g=new THREE.Group();g.position.set(cx,0,SZ);S.add(g);
  cyl(g,RR,RR,HB,M.steel,[0,YB+HB/2,0],72);
  for(let k=0;k<=4;k++)tor(g,RR+.02,.05,M.steel,[0,YB+k*HB/4,0],[Math.PI/2,0,0],72);
  cyl(g,.3,RR,1.4,M.steel,[0,YB+HB+.7,0],72);
  tor(g,.78,.03,M.steel,[0,YB+HB+.75,0],[Math.PI/2,0,0],48);
  cyl(g,.22,.22,.4,M.steel,[0,YB+HB+1.6,0],24);cyl(g,.3,.3,.06,M.steel,[0,YB+HB+1.4,0],24);
  cyl(g,RR,.32,1.5,M.steel,[0,YB-.75,0],72);
  cyl(g,.3,.3,.5,M.steel,[0,1.85,0],28);cyl(g,.42,.42,.07,M.steel,[0,1.62,0],28);
  pipeY(g,0,.9,1.6,0,.2);elbow(g,0,.9,0,.2);
  // pieds treillis
  const lg=[];const rb=1.5,rt=1.27;
  for(let k=0;k<4;k++){const an=Math.PI/4+k*Math.PI/2;const bx=Math.cos(an)*rb,bz=Math.sin(an)*rb,tx=Math.cos(an)*rt,tz=Math.sin(an)*rt;
    lg.push([bx,tx,bz,tz]);rod(g,[bx,0,bz],[tx,YB-.05,tz],.1,M.frameSteel,10);box(g,.45,.07,.45,M.frameSteel,[bx,.035,bz])}
  const lerp=(i,y)=>{const f=y/(YB-.05),L=lg[i];return[L[0]+(L[1]-L[0])*f,y,L[2]+(L[3]-L[2])*f]};
  tor(g,rt,.07,M.frameSteel,[0,YB-.05,0],[Math.PI/2,0,0],48);
  for(let i=0;i<4;i++){const j=(i+1)%4;
    for(const y of[1.8,2.55])rod(g,lerp(i,y),lerp(j,y),.045,M.frameSteel,6);
    rod(g,lerp(i,2.55),lerp(j,YB-.05),.04,M.frameSteel,6);rod(g,lerp(j,2.55),lerp(i,YB-.05),.04,M.frameSteel,6);
    if(i%2===1){rod(g,lerp(i,.1),lerp(j,1.8),.04,M.frameSteel,6);rod(g,lerp(j,.1),lerp(i,1.8),.04,M.frameSteel,6)}}
  if(ladder){const z=RR+.14;for(const s of[-1,1])box(g,.05,6.4,.05,M.frameSteel,[s*.2,YB+3.3,z]);
    for(let y=YB+.2;y<YB+HB;y+=.3)cyl(g,.016,.016,.4,M.frameSteel,[0,y,z],8,[0,0,Math.PI/2]);
    for(const y of[YB+1.2,YB+3.6,YB+6])for(const s of[-1,1])box(g,.05,.05,.14,M.frameSteel,[s*.2,y,z-.07]);
    for(let y=YB+2.4;y<YB+HB;y+=.8)tor(g,.34,.016,M.frameSteel,[0,y,z+.12],[0,0,0],20,Math.PI*1.3)}
}
SX.forEach((x,i)=>silo(x,i===0));
// élévateur à godets
const EX=2.0;{
  const g=new THREE.Group();g.position.set(EX,0,SZ);S.add(g);
  rbox(g,1.15,1.1,1.15,M.door,[0,.55,0],[0,0,0],.05);
  box(g,.85,10.6,.55,M.door,[0,6.3,0]);
  for(let y=2;y<11.4;y+=1.45)box(g,.95,.09,.65,M.frameSteel,[0,y,0]);
  for(const y of[3.2,6,8.8]){rbox(g,.5,.7,.06,M.frameSteel,[0,y,.3],[0,0,0],.02);for(const sx of[-1,1])for(const sy of[-1,1])cyl(g,.018,.018,.04,M.dark,[sx*.2,y+sy*.3,.33],8,[Math.PI/2,0,0])}
  rbox(g,1.5,1.45,1.0,M.door,[0,12.2,0],[0,0,0],.06);
  cyl(g,.34,.34,.9,M.frameSteel,[.1,13.25,0],20,[0,0,Math.PI/2]);rbox(g,.5,.5,.6,M.frameSteel,[-.5,13.05,0],[0,0,0],.04);
  box(g,.6,.04,.7,M.frameSteel,[.05,12.95,0]);
  elbow(g,0,12.2,0,.25);
}
// conduite pneumatique : toit du bâtiment -> élévateur
pipeY(S,-1.0,8.55,9.15,SZ,.2);elbow(S,-1.0,9.15,SZ);pipeX(S,-1.0,EX-.4,9.15,SZ,.2,1.5);
pipeX(S,0.5,EX-.5,2.2,SZ,.2,1.1);                       // bâtiment -> pied d'élévateur
pipeX(S,EX+.5,SX[2],.9,SZ,.2,1.9);                      // collecteur silos -> élévateur
// distribution haute
pipeX(S,EX+.4,SX[2],12.2,SZ,.22,1.6);
for(const x of SX){pipeY(S,x,11.7,12.2,SZ,.2);elbow(S,x,12.2,SZ,.22)}
// supports de tuyau
for(const x of[3.3,6.3,9.5]){rod(S,[x,12.0,SZ],[x,11.0,SZ+.0],.05,M.frameSteel,6)}
S.traverse(o=>{});

/* ---------- monticule de balle de riz ---------- */
{
  const R=2.9,Hh=2.05,pts=[];
  for(let i=0;i<=60;i++){const u=i/60,r=R*(1-u);pts.push(new THREE.Vector2(Math.max(r,.001),Hh*Math.pow(u,1.0)*(1-.05*Math.pow(1-u,2))*1+0.0))}
  // profil : base (r=R,y=0) -> sommet (r=0,y=Hh) légèrement concave
  const prof=[];for(let i=0;i<=64;i++){const u=i/64;const r=R*(1-u);const y=Hh*(1-Math.pow(1-u,1.0))*0+Hh*(1-Math.pow(r/R,1.18));prof.push(new THREE.Vector2(Math.max(r,.0001),y))}
  const g=new THREE.LatheGeometry(prof,128);const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),an=Math.atan2(z,x),k=Math.min(1,y/.4)*(1-y/Hh)*0.9;
    const n=Math.sin(an*3+1.3)*.07+Math.sin(an*5+.4)*.04;const f=1+n*k;p.setX(i,x*f);p.setZ(i,z*f)}
  g.computeVertexNormals();
  const pile=new THREE.Mesh(g,M.husk);pile.position.set(-4,0,6.2);pile.castShadow=true;pile.receiveShadow=true;root.add(pile);
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(R*2.7,R*2.7),new THREE.MeshBasicMaterial({map:T.shade,transparent:true,depthWrite:false,opacity:.55}));
  sh.rotation.x=-Math.PI/2;sh.position.set(-4,.012,6.2);root.add(sh);
}

/* ---------- convoyeur à bande ---------- */
const belt={mounds:[],len:0};
{
  const Sp=new THREE.Vector3(-8.5,3.85,-3),E=new THREE.Vector3(-14.2,2.7,-3),d=E.clone().sub(Sp),Ln=d.length();belt.len=Ln;
  const og=new THREE.Group();og.position.copy(Sp);og.rotation.y=Math.PI;root.add(og);const g=new THREE.Group();g.rotation.z=-Math.atan2(-d.y,-d.x);og.add(g);
  const bm=M.rubber;T.rubber.repeat.set(Ln/.6,1);
  for(const s of[-1,1])box(g,Ln,.3,.06,M.green,[Ln/2,0,s*.54]);
  box(g,Ln,.07,.98,bm,[Ln/2,.12,0]);
  box(g,Ln,.04,.9,M.dark,[Ln/2,-.14,0]);
  for(const x of[.1,Ln-.1])cyl(g,.17,.17,1.05,M.frameSteel,[x,.02,0],24,[Math.PI/2,0,0]);
  for(let x=.7;x<Ln-.4;x+=.9)cyl(g,.06,.06,.98,M.frameSteel,[x,-.1,0],12,[Math.PI/2,0,0]);
  for(let k=0;k<7;k++){const m=add(g,new THREE.SphereGeometry(.3,14,8),M.husk,[0,.2,0]);m.scale.set(1.3,.35,1.05);m.userData={o:k/7*Ln,z:(rnd()-.5)*.12};belt.mounds.push(m)}
  // chevalets
  for(const t of[.28,.58,.86]){const c=Sp.clone().lerp(E,t);const y=c.y-.28;
    for(const s of[-1,1]){rod(root,[c.x,y,c.z+s*.5],[c.x,0,c.z+s*.62],.055,M.frameSteel,8);box(root,.4,.05,.3,M.frameSteel,[c.x,.025,c.z+s*.62])}
    box(root,.12,.12,1.1,M.frameSteel,[c.x,y,c.z]);rod(root,[c.x,.9,c.z-.58],[c.x,.2,c.z+.6],.03,M.frameSteel,6)}
  // trémie de décharge + bac récepteur
  const fn=cyl(root,.55,.28,.75,M.green,[E.x-.1,2.18,E.z],4);fn.rotation.y=Math.PI/4;
  function bin(x,z,w,h,dz,heap=true){const b=new THREE.Group();b.position.set(x,0,z);root.add(b);
    box(b,w,.1,dz,M.green,[0,.05,0]);for(const s of[-1,1]){box(b,.08,h,dz,M.green,[s*w/2,h/2,0]);box(b,w,h,.08,M.green,[0,h/2,s*dz/2])}
    for(const s of[-1,1])box(b,.12,.12,dz+.1,M.frameSteel,[s*w/2,h,0]);
    box(b,w-.08,h*.82,dz-.08,M.husk,[0,h*.41,0]);
    if(heap){const m=add(b,new THREE.ConeGeometry(Math.min(w,dz)*.48,h*.28,28),M.husk,[0,h*.82+h*.14,0])}
    return b}
  bin(E.x-.1,E.z,1.9,1.9,1.9);
  bin(-12.2,0.2,1.2,.85,1.0);bin(-13.7,1.6,1.1,.85,1.0);
  // palette
  for(let k=0;k<4;k++)box(root,1.1,.09,.18,M.wood,[-11.7,.14,3.4+k*.34],[0,.0,0]);
}

/* ---------- scène, rendu ---------- */
const cv=document.getElementById('cv');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.outputColorSpace=THREE.SRGBColorSpace;
cv.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.add(root);
const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;
scene.add(new THREE.HemisphereLight(0xfff6e6,0xb8ad8a,.55));
const sun=new THREE.DirectionalLight(0xfff1dc,2.6);sun.position.set(-16,26,18);sun.target.position.set(0,2,0);
sun.castShadow=true;const big=renderer.capabilities.maxTextureSize>=8192;sun.shadow.mapSize.set(big?4096:2048,big?4096:2048);
Object.assign(sun.shadow.camera,{left:-26,right:26,top:26,bottom:-26,near:1,far:90});sun.shadow.bias=-.0004;sun.shadow.normalBias=.04;sun.shadow.radius=4;
scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight(0xdfe8ff,.5);fill.position.set(18,10,10);scene.add(fill);

const camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,300);
const DIR=new THREE.Vector3(-Math.cos(Math.PI/6)*Math.SQRT1_2,.5,Math.cos(Math.PI/6)*Math.SQRT1_2).normalize();
const TARGET=new THREE.Vector3(-.5,3.6,-.5);
function resetView(){camera.position.copy(TARGET).addScaledVector(DIR,90);camera.zoom=1;camera.updateProjectionMatrix();controls.target.copy(TARGET);controls.update()}
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;controls.minZoom=.55;controls.maxZoom=4;controls.maxPolarAngle=Math.PI*.47;controls.minPolarAngle=.25;controls.autoRotateSpeed=.9;
function resize(){const w=innerWidth,h=innerHeight,a=w/h,vs=Math.max(36,50/a);
  camera.left=-vs*a/2;camera.right=vs*a/2;camera.top=vs/2;camera.bottom=-vs/2;camera.updateProjectionMatrix();renderer.setSize(w,h)}
addEventListener('resize',resize);resize();resetView();

/* ---------- annotations ---------- */
const HS=[
 ['Bâtiment principal','Usine à 2 niveaux · toiture en tôle ondulée',[-4,7.4,-0.5]],
 ['Groupe de 3 silos','Métal brossé · pieds en treillis',[7.9,8.5,-.7]],
 ['Élévateur à godets','Transfert vertical vers les silos',[2,10.5,-2]],
 ['Monticule de balle de riz','Tas conique posé sur la dalle',[-4,1.6,6.2]],
 ['Convoyeur à bande','Bacs de réception du grain',[-11.4,3.5,-3]],
 ['Rizière','Parcelle sur socle biseauté',[0,1.6,-9.5]]
].map(([t,s,p])=>{const b=document.createElement('button');b.className='hotspot';b.type='button';b.setAttribute('aria-label',t);
  b.innerHTML=`<span class="hr"></span><span class="hd"></span><span class="tip"><b>${t}</b><span>${s}</span></span>`;document.getElementById('hs').appendChild(b);return{b,v:new THREE.Vector3(...p)}});
const tmp=new THREE.Vector3();
function placeHS(){const w=innerWidth,h=innerHeight;for(const o of HS){tmp.copy(o.v).project(camera);o.b.style.left=((tmp.x+1)/2*w)+'px';o.b.style.top=((1-tmp.y)/2*h)+'px'}}

/* ---------- UI ---------- */
const bar=document.getElementById('bar');for(let i=0;i<18;i++){const e=document.createElement('i');if(!i)e.className='a';bar.appendChild(e)}
const $=id=>document.getElementById(id);
$('bAnn').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);HS.forEach(o=>o.b.classList.toggle('off',!on))};
$('bRot').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);controls.autoRotate=on};
$('bRes').onclick=resetView;
$('bPng').onclick=()=>{renderer.render(scene,camera);const a=document.createElement('a');a.href=renderer.domElement.toDataURL('image/png');a.download='riceware-etape1-rizerie.png';a.click()};
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')resetView()});
controls.addEventListener('start',()=>$('hint').style.opacity=0);

/* ---------- boucle ---------- */
let vis=true;document.addEventListener('visibilitychange',()=>vis=!document.hidden);
const clock=new THREE.Clock();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(){requestAnimationFrame(loop);if(!vis)return;const dt=Math.min(clock.getDelta(),.05);
  if(!reduce){const sp=.55;T.rubber.offset.x-=dt*sp/.6*0+dt*sp/.6;for(const m of belt.mounds){m.userData.o=(m.userData.o+dt*sp)%belt.len;m.position.set(m.userData.o,.2,m.userData.z)}}
  controls.update();renderer.render(scene,camera);placeHS()}
loop();
setTimeout(()=>$('ld').classList.add('h'),350);
</script>
