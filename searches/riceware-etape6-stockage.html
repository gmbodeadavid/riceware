<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RiceWare CI — Étape 6 · Stockage</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1C2A20;--amber:#D3A61F;--green:#2E7D5B}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:'IBM Plex Sans',sans-serif;background:#fff}
#cv{position:fixed;inset:0}#cv canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#hs{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.hot{position:absolute;width:22px;height:22px;padding:0;border:0;background:none;transform:translate(-50%,-50%);cursor:pointer;pointer-events:auto}
.hot i{position:absolute;inset:0;border:2px solid var(--amber);border-radius:50%;background:rgba(255,253,246,.9);animation:p 1.9s infinite}
.hot u{position:absolute;inset:7px;border-radius:50%;background:var(--amber)}
.hot div{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);background:rgba(28,42,32,.94);color:#fff;font-size:12px;line-height:1.35;padding:7px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.18s;text-align:left}
.hot div b{display:block;font-weight:600}.hot div span{opacity:.8}
.hot:hover div,.hot:focus-visible div{opacity:1;transform:translate(-50%,0)}
@keyframes p{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.45);opacity:0}}
#ui{position:fixed;inset:0;z-index:10;padding:22px 24px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
#top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
h1{margin:0;font:700 24px/1.1 'Bricolage Grotesque',sans-serif}
h2{margin:4px 0 0;font-size:14px;font-weight:400;color:rgba(28,42,32,.72)}
#ctl{display:flex;gap:7px;flex-wrap:wrap;pointer-events:auto}
.btn{border:1px solid #DDD6BF;background:#FFFDF6;color:var(--ink);font:500 13px 'IBM Plex Sans',sans-serif;padding:8px 13px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--green)}.btn:focus-visible{outline:2px solid var(--green);outline-offset:2px}.btn[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
#cap{font-size:13px;color:rgba(28,42,32,.75);max-width:560px;line-height:1.45}
@media(prefers-reduced-motion:reduce){.hot i{animation:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="cv"></div><div id="hs"></div>
<div id="ui"><div id="top"><div><h1>RiceWare CI — Étape 6 · Stockage</h1><h2>Entrepôt de stockage — vue isométrique PBR</h2></div>
<div id="ctl"><button class="btn" id="bRot" aria-pressed="false">Rotation auto</button><button class="btn" id="bAnn" aria-pressed="true">Annotations</button><button class="btn" id="bRotor" aria-pressed="true">Animation en marche</button><button class="btn" id="bReset">Réinitialiser la vue</button></div></div>
<div id="cap">La farine tamisée est ensachée et rangée : sacs sur les étagères hautes, bacs de poudre en bas, chariot élévateur et opérateur pour le contrôle du stock.</div></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;R.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('cv').appendChild(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xffffff);
scene.environment=new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=.6;
const cam=new THREE.OrthographicCamera(-1,1,1,-1,-80,80);
const TGT=new THREE.Vector3(1.2,2,.6),HOME=TGT.clone().add(new THREE.Vector3(10,8,10));cam.position.copy(HOME);
const ctl=new OrbitControls(cam,R.domElement);ctl.target.copy(TGT);ctl.enableDamping=true;ctl.enablePan=false;
ctl.minPolarAngle=.35;ctl.maxPolarAngle=1.45;ctl.minZoom=.6;ctl.maxZoom=2.5;ctl.autoRotateSpeed=1.2;
const sun=new THREE.DirectionalLight(0xfff3dc,2.4);sun.position.set(8,13,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-11,right:11,top:11,bottom:-11,near:1,far:40});sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;
scene.add(sun,new THREE.HemisphereLight(0xffffff,0xd8cfb0,.7));

const M=(c,r=.6,m=0,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,flatShading:true,...o});
const blue=M(0x2B5D8C,.4,.5),orange=M(0xE2751D,.4,.4),galv=M(0xAEB7BB,.35,.8),dark=M(0x3a4044,.5,.5),steel=M(0xB8BEC0,.28,.9),
 green=M(0x2E8B57,.45,.3),fgray=M(0x6a7378,.5,.5),tire=M(0x202427,.8),wood=M(0xB88B55,.8),skin=M(0xD9A47E,.7),yellow=M(0xF2C200,.4),white=M(0xF4F4F0,.8),
 vest=M(0xF26B1D,.6),gray=M(0x6d767b,.7),gray2=M(0x4c5458,.8),boot=M(0x2a2420,.8),beaconM=M(0xff8c00,.3,0,{emissive:0xff6a00,emissiveIntensity:.6});
const sh=m=>{m.castShadow=m.receiveShadow=true;return m};
const box=(w,h,d,mat,x,y,z,p)=>{const m=sh(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat));m.position.set(x,y,z);p.add(m);return m};
const cyl=(rt,rb,h,seg,mat,x,y,z,p,rx=0,rz=0)=>{const m=sh(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat));m.position.set(x,y,z);m.rotation.set(rx,0,rz);p.add(m);return m};
const beam=(a,b,t,mat,p)=>{a=new THREE.Vector3(...a);b=new THREE.Vector3(...b);const m=sh(new THREE.Mesh(new THREE.BoxGeometry(t,t,a.distanceTo(b)),mat));m.position.copy(a).add(b).multiplyScalar(.5);m.lookAt(b);p.add(m);return m};

const floor=new THREE.Mesh(new THREE.CylinderGeometry(9,9,.2,64),M(0xB4B4B4,.9));floor.position.set(1.2,-.1,.6);floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.TorusGeometry(8.6,.04,6,96),M(0xD3A61F,.6));ring.rotation.x=Math.PI/2;ring.position.set(1.2,.01,.6);scene.add(ring);
for(const z of[1.0,1.1])box(12,.004,.07,M(0xF2C200,.7),1.2,.002,z,scene).castShadow=false;

// groupes
const Racks=new THREE.Group(),Forklift=new THREE.Group(),Workers=new THREE.Group();scene.add(Racks,Forklift,Workers);
const LV=[.35,1.45,2.55,3.65],RC=[-1.8,1.8];
for(const cx of RC){
 for(const sx of[-1,1])for(const sz of[-1,1]){box(.1,4.78,.1,blue,cx+sx*1.6,2.41,sz*.55,Racks);box(.26,.02,.26,dark,cx+sx*1.6,.01,sz*.55,Racks)}
 for(const l of LV){for(const sz of[-1,1])box(3.1,.1,.08,orange,cx,l-.05,sz*.55,Racks);box(3.1,.04,1.01,galv,cx,l-.02,0,Racks)}
 for(const sx of[-1,1]){const x=cx+sx*1.6;beam([x,.3,-.5],[x,2.5,.5],.04,blue,Racks);beam([x,2.5,.5],[x,4.6,-.5],.04,blue,Racks);for(const y of[4.7])box(.06,.06,1,blue,x,y,0,Racks)}
}
// bacs gris + poudre (instanced)
function binGeo(){const p=[],W=1,H=.55,D=.85,t=.04;const a=(w,h,d,x,y,z)=>{const g=new THREE.BoxGeometry(w,h,d);g.translate(x,y,z);p.push(g.toNonIndexed())};
 a(W,t,D,0,t/2,0);a(W,H-t,t,0,t+(H-t)/2,D/2-t/2);a(W,H-t,t,0,t+(H-t)/2,-D/2+t/2);a(t,H-t,D-2*t,W/2-t/2,t+(H-t)/2,0);a(t,H-t,D-2*t,-W/2+t/2,t+(H-t)/2,0);
 a(W+.04,.03,.06,0,H+.015,D/2-.015);a(W+.04,.03,.06,0,H+.015,-D/2+.015);a(.06,.03,D,W/2-.015,H+.015,0);a(.06,.03,D,-W/2+.015,H+.015,0);return mergeGeometries(p)}
function powGeo(){const p=[];const s=new THREE.BoxGeometry(.9,.41,.75);s.translate(0,.245,0);p.push(s.toNonIndexed());const m=new THREE.IcosahedronGeometry(1,1);m.scale(.42,.1,.32);m.translate(0,.46,0);p.push(m);return mergeGeometries(p)}
const bins=[];for(const cx of RC)for(const l of LV.slice(0,2))for(const dx of[-1,0,1])bins.push([cx+dx,l,0]);
const binIM=new THREE.InstancedMesh(binGeo(),M(0x8a9298,.55,.1),bins.length),powIM=new THREE.InstancedMesh(powGeo(),M(0xF1E8D2,.95),bins.length);
binIM.castShadow=binIM.receiveShadow=powIM.receiveShadow=true;Racks.add(binIM,powIM);
const o=new THREE.Object3D(),col=new THREE.Color();
bins.forEach((b,i)=>{o.position.set(...b);o.rotation.set(0,0,0);o.scale.set(1,1,1);o.updateMatrix();binIM.setMatrixAt(i,o.matrix);powIM.setMatrixAt(i,o.matrix);powIM.setColorAt(i,col.setHSL(.1,.35,.84+Math.random()*.08))});
// sacs bruns + étiquettes (instanced)
const sacks=[],labels=[];
for(const cx of RC)for(const l of LV.slice(2))for(const dx of[-1,0,1])for(let k=0;k<4;k++)for(const z of[-.23,.23]){if(cx===RC[1]&&l===LV[2]&&dx===1)continue;const x=cx+dx+(k%2?.03:-.03);const y=l+.11+k*.22;sacks.push([x,y,z]);if(z>0)labels.push([x,y,z+.23+.006])}
const FX=6.4,FZ=2.9;
const sackIM=new THREE.InstancedMesh(new THREE.BoxGeometry(.85,.22,.46),M(0xA9784A,.9),sacks.length),labIM=new THREE.InstancedMesh(new THREE.BoxGeometry(.34,.14,.012),M(0xFBFBF6,.8),labels.length);
sackIM.castShadow=sackIM.receiveShadow=true;Racks.add(sackIM,labIM);
sacks.forEach((s,i)=>{o.position.set(...s);o.updateMatrix();sackIM.setMatrixAt(i,o.matrix);sackIM.setColorAt(i,col.setHSL(.075+Math.random()*.015,.42,.38+Math.random()*.08))});
labels.forEach((s,i)=>{o.position.set(...s);o.updateMatrix();labIM.setMatrixAt(i,o.matrix)});

// chariot élévateur (avant = +x local ; tourné vers -x)
const fk=new THREE.Group();fk.position.set(FX,0,FZ);fk.rotation.y=Math.PI;Forklift.add(fk);
box(1.4,.55,1,green,.3,.625,0,fk);box(.6,.7,1,fgray,-.7,.7,0,fk);box(1.4,.06,1.02,dark,.3,.38,0,fk);
const wheels=[];for(const x of[-.65,.7])for(const z of[-.62,.62]){const wg=new THREE.Group();wg.position.set(x,.32,z);fk.add(wg);cyl(.32,.32,.22,12,tire,0,0,0,wg,Math.PI/2);cyl(.14,.14,.23,8,steel,0,0,0,wg,Math.PI/2);box(.08,.12,.02,steel,.2,0,z>0?.12:-.12,wg);wheels.push(wg)}
box(.2,.25,.5,dark,-.3,1.025,0,fk);box(.08,.5,.5,dark,-.44,1.4,0,fk);
for(const x of[-.7,.5])for(const z of[-.45,.45])box(.06,x<0?1.4:1.55,.06,dark,x,x<0?1.75:1.675,z,fk);
box(1.4,.05,1,dark,-.1,2.475,0,fk);cyl(.06,.06,.12,8,beaconM,-.1,2.56,0,fk);
for(const z of[-.1,.1]){box(.4,.14,.14,gray2,-.2,1.22,z,fk);box(.14,.25,.14,gray2,-.07,1.025,z,fk);box(.2,.06,.14,boot,.1,.93,z,fk)}
box(.24,.56,.36,vest,-.28,1.57,0,fk);
const dh=new THREE.Group();dh.position.set(-.28,2.02,0);fk.add(dh);
const hd=sh(new THREE.Mesh(new THREE.SphereGeometry(.15,8,6),skin));dh.add(hd);
const ht=sh(new THREE.Mesh(new THREE.SphereGeometry(.18,10,6,0,Math.PI*2,0,Math.PI/2),yellow));ht.position.y=.05;dh.add(ht);cyl(.23,.23,.025,12,yellow,0,.05,0,dh);box(.09,.1,.16,white,.14,-.03,0,dh);
for(const z of[-1,1])beam([-.28,1.75,z*.23],[.18,1.5,z*.13],.1,vest,fk);
cyl(.15,.15,.03,10,dark,.2,1.5,0,fk,0,1.9);cyl(.02,.02,.5,6,dark,.29,1.2,0,fk,0,-.35);
for(const z of[-.35,.35])box(.08,3.4,.1,dark,1.05,2.0,z,fk);box(.08,.06,.6,dark,1.05,.6,0,fk);box(.08,.06,.6,dark,1.05,3.65,0,fk);
const lift=new THREE.Group();lift.position.y=.3;fk.add(lift);
box(.05,1,.9,steel,1.13,1,0,lift);
for(const z of[-.3,.3]){box(.95,.06,.1,steel,1.68,.55,z,lift);box(.05,.5,.1,steel,1.18,.77,z,lift)}
function makePallet(p){const g=new THREE.Group();p.add(g);
 for(const z of[-.4,0,.4])box(.9,.12,.1,wood,1.7,.52,z,g);box(.9,.03,.95,wood,1.7,.595,0,g);
 const a=new THREE.InstancedMesh(new THREE.BoxGeometry(.85,.22,.46),M(0xA9784A,.9),6),b=new THREE.InstancedMesh(new THREE.BoxGeometry(.34,.14,.012),M(0xFBFBF6,.8),6);
 a.castShadow=a.receiveShadow=true;g.add(a,b);
 for(let k=0;k<3;k++)for(let j=0;j<2;j++){const zl=j?.23:-.23,y=.72+k*.22,x=1.7+(k%2?.03:-.03);o.position.set(x,y,zl);o.updateMatrix();a.setMatrixAt(k*2+j,o.matrix);a.setColorAt(k*2+j,col.setHSL(.075+Math.random()*.015,.42,.38+Math.random()*.08));
  o.position.set(x,y,j?.466:-.466);o.updateMatrix();b.setMatrixAt(k*2+j,o.matrix)}
 return g}
const loadP=makePallet(lift);
const shelfP=makePallet(Racks);shelfP.position.set(2.8,2.09,1.85);shelfP.rotation.y=Math.PI/2;shelfP.visible=false;

// ouvriers
function worker(){const g=new THREE.Group(),w={g};
 for(const s of[-1,1]){box(.15,.8,.17,gray2,s*.1,.45,0,g);box(.17,.1,.26,boot,s*.1,.05,.04,g)}
 box(.42,.58,.26,vest,0,1.13,0,g);box(.43,.06,.27,M(0xe6e6e0,.5),0,1.05,0,g);
 w.head=new THREE.Group();w.head.position.y=1.5;g.add(w.head);
 const h=sh(new THREE.Mesh(new THREE.SphereGeometry(.155,8,6),skin));h.position.y=.08;w.head.add(h);
 const hat=sh(new THREE.Mesh(new THREE.SphereGeometry(.18,10,6,0,Math.PI*2,0,Math.PI/2),yellow));hat.position.y=.13;w.head.add(hat);
 cyl(.23,.23,.025,12,yellow,0,.13,.03,w.head);box(.17,.1,.09,white,0,.04,.14,w.head);
 for(const s of[-1,1]){const a=new THREE.Group();a.position.set(s*.27,1.38,0);g.add(a);box(.11,.55,.12,vest,0,-.26,0,a);box(.1,.1,.11,skin,0,-.58,0,a);w[s>0?'R':'L']=a}
 return w}
const wk=worker();wk.g.position.set(-2,0,1.15);wk.g.rotation.y=Math.PI;wk.head.rotation.x=.5;wk.R.rotation.x=-1.25;wk.L.rotation.x=-.5;
box(.24,.3,.02,M(0xE8E4D8,.7),0,-.7,.08,wk.L);Workers.add(wk.g);

// annotations
const spots=[['Rayonnages','Deux structures métalliques',[0,4.9,0]],['Sacs de farine','Étagères hautes',[-1.8,3.9,.6]],['Bacs de poudre','Étagères basses',[1.8,1.0,.5]],['Chariot élévateur','Transport des palettes',[FX-.4,2.5,FZ]],['Contrôle du stock','Inspection d\u2019un bac',[-2,2.1,1.15]]];
const hs=document.getElementById('hs');
const els=spots.map(s=>{const b=document.createElement('button');b.className='hot';b.setAttribute('aria-label',s[0]);b.innerHTML=`<i></i><u></u><div><b>${s[0]}</b><span>${s[1]}</span></div>`;hs.appendChild(b);return b});
let run=true;
const bR=document.getElementById('bRot'),bP=document.getElementById('bRotor'),bA=document.getElementById('bAnn');
bR.onclick=()=>{ctl.autoRotate=!ctl.autoRotate;bR.setAttribute('aria-pressed',ctl.autoRotate)};
bP.onclick=()=>{run=!run;bP.setAttribute('aria-pressed',run);bP.textContent=run?'Animation en marche':'Animation à l\u2019arrêt'};
bA.onclick=()=>{const on=bA.getAttribute('aria-pressed')!=='true';bA.setAttribute('aria-pressed',on);hs.style.display=on?'':'none'};
document.getElementById('bReset').onclick=()=>{cam.position.copy(HOME);ctl.target.copy(TGT);cam.zoom=1;cam.updateProjectionMatrix();ctl.update()};
function fit(){const w=innerWidth,h=innerHeight,a=w/h,s=Math.max(5.6,9.6/a);R.setSize(w,h);cam.left=-s*a;cam.right=s*a;cam.top=s;cam.bottom=-s;cam.updateProjectionMatrix()}
addEventListener('resize',fit);fit();
const v=new THREE.Vector3(),clock=new THREE.Clock();let tt=0,at=0,px=FX;
const ez=u=>u*u*(3-2*u);
const P=Math.PI,seg=[[4,6.4,2.8,2.9,2.9,P,P,.3,.3],[1.5,2.8,2.8,2.9,2.9,P,P/2,.3,.3],[3,2.8,2.8,2.9,2.9,P/2,P/2,.3,2.15],[2,2.8,2.8,2.9,1.85,P/2,P/2,2.15,2.15],[1.2,2.8,2.8,1.85,1.85,P/2,P/2,2.15,2.06],[2,2.8,2.8,1.85,2.9,P/2,P/2,2.06,2.06],[2.5,2.8,2.8,2.9,2.9,P/2,P/2,2.06,.3],[1.5,2.8,2.8,2.9,2.9,P/2,P,.3,.3],[4,2.8,6.4,2.9,2.9,P,P,.3,.3],[.6,6.4,6.4,2.9,2.9,P,P,.3,.3]];
const D=seg.reduce((q,r)=>q+r[0],0),REL=4+1.5+3+2+.75;let pz=FZ;
function state(c){const u=c>=D?2*D-c:c;let q=u,i=0;while(i<seg.length-1&&q>seg[i][0]){q-=seg[i][0];i++}
 const g=seg[i],f=ez(Math.min(1,Math.max(0,q/g[0]))),l=k=>g[k]+(g[k+1]-g[k])*f;return{x:l(1),z:l(3),r:l(5),L:l(7),load:u<REL}}
R.setAnimationLoop(()=>{
 const dt=Math.min(clock.getDelta(),.1);tt+=dt;if(run)at+=dt;const t=tt;
 if(run){const st=state(at%(2*D));fk.position.set(st.x,0,st.z);fk.rotation.y=st.r;lift.position.y=st.L;const df=(st.x-px)*Math.cos(st.r)-(st.z-pz)*Math.sin(st.r);px=st.x;pz=st.z;for(const w of wheels)w.rotation.z-=df/.32;loadP.visible=st.load;shelfP.visible=!st.load;spots[3][2]=[st.x,2.6,st.z];beaconM.emissiveIntensity=.6+.6*Math.sin(t*6);dh.rotation.y=Math.sin(t*.7)*.5;wk.head.rotation.x=.5+Math.sin(t*.9)*.08;wk.R.rotation.x=-1.25+Math.sin(t*1.3)*.05}
 ctl.update();R.render(scene,cam);
 const W_=innerWidth,H_=innerHeight;spots.forEach((s,i)=>{v.set(...s[2]).project(cam);els[i].style.left=(v.x*.5+.5)*W_+'px';els[i].style.top=(-v.y*.5+.5)*H_+'px'});
});
</script></body></html>
