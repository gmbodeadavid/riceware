[-5.3,5.3].forEach(x=>{box(3.4,1.3,.05,M(0x24343f,{roughness:.06,metalness:.8,envMapIntensity:1.4}),x,4.5,-5.98,G_bld);box(3.55,.08,.1,steel,x,5.2,-5.96,G_bld);box(3.55,.08,.1,steel,x,3.82,-5.96,G_bld)});

{const s=new THREE.Shape();s.moveTo(0,0);s.lineTo(1.1,0);s.lineTo(0,TOP);s.closePath();const gm=new THREE.ExtrudeGeometry(s,{depth:3.6,bevelEnabled:false});gm.translate(0,0,-1.8);

[-1.1,1.1].forEach(x=>{box(.1,1.2,4.6,paint,x,.67,2.3,bed);box(.14,.1,4.6,steel,x,1.32,2.3,bed);
  for(let i=0;i<5;i++)box(.06,1.2,.1,paint,x*1.07,.67,.35+i*.95,bed)});
box(2.3,1.5,.12,paint,0,.82,4.54,bed);
const logo=ctex(512,128,(g,w,h)=>{g.fillStyle='#f5f6f3';g.fillRect(0,0,w,h);g.fillStyle='#2E7D5B';g.fillRect(0,h-26,w,26);g.fillStyle='#D3A61F';g.fillRect(0,h-34,w,8);
  g.fillStyle='#1C2A20';g.font='700 62px "Bricolage Grotesque",Arial';g.textAlign='center';g.textBaseline='middle';g.fillText('RICEWARE CI',w/2,48)});
[1,-1].forEach(s=>{const p=new THREE.Mesh(new THREE.PlaneGeometry(3.4,.85),new THREE.MeshStandardMaterial({map:logo,roughness:.35}));p.position.set(s*1.222,.62,2.3);p.rotation.y=s*Math.PI/2;bed.add(p)});
// riz dans la benne
const riceMat=new THREE.MeshStandardMaterial({color:0xffffff,map:grain(3,3),roughness:.62,flatShading:true,envMapIntensity:.7});
const bg=new THREE.BoxGeometry(2,1,4.3,8,1,12),bp=bg.attributes.position;
for(let i=0;i<bp.count;i++){const x=bp.getX(i),y=bp.getY(i),z=bp.getZ(i);if(y>0)bp.setY(i,.5+.1*Math.sin(x*4)*Math.cos(z*2.5)+.14*(1-Math.abs(x))*Math.cos(z*.7))}
bg.translate(0,.5,0);bg.computeVertexNormals();
const bedRice=sh(new THREE.Mesh(bg,riceMat));bedRice.position.set(0,.07,2.3);bed.add(bedRice);
// vérin hydraulique
const ramL=sh(new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,1,16),dk)),ramU=sh(new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,1,16),rim));G_truck.add(ramL,ramU);

/* ---- riz déversé : cône aplati texturé + coulée ---- */
const pg=new THREE.ConeGeometry(1,1,30,8,true);pg.translate(0,.5,0);const pp=pg.attributes.position;
for(let i=0;i<pp.count;i++){const x=pp.getX(i),y=pp.getY(i),z=pp.getZ(i),n=1+.13*Math.sin(Math.atan2(z,x)*5+y*3)*(1-y);pp.setXYZ(i,x*n,y+.04*Math.sin(x*9+z*7)*(1-y),z*n)}
pg.computeVertexNormals();
const pile=sh(new THREE.Mesh(pg,riceMat));pile.position.set(0,0,-4.4);G_rice.add(pile);
const NR=14,NS=12,sPos=new Float32Array((NR+1)*(NS+1)*3),sUv=new Float32Array((NR+1)*(NS+1)*2),idx=[];
for(let r=0;r<=NR;r++)for(let s=0;s<=NS;s++){const k=r*(NS+1)+s;sUv[k*2]=s/NS*2;sUv[k*2+1]=r/NR*3;if(r<NR&&s<NS){const a=k,b=k+NS+1;idx.push(a,b,a+1,b,b+1,a+1)}}
const sGeo=new THREE.BufferGeometry();sGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));sGeo.setAttribute('uv',new THREE.BufferAttribute(sUv,2));sGeo.setIndex(idx);
const streamTex=grain(1,1);
const stream=sh(new THREE.Mesh(sGeo,new THREE.MeshStandardMaterial({map:streamTex,roughness:.55,side:THREE.DoubleSide})));stream.frustumCulled=false;G_rice.add(stream);
function updStream(y1,flow){const y0=1.87,z0=-2.4,z1=-4.15;
  for(let r=0;r<=NR;r++){const t=r/NR,y=y0+(y1-y0)*t*t,z=z0+(z1-z0)*t,dy=2*(y1-y0)*t,dz=z1-z0,l=Math.hypot(dy,dz),ny=-dz/l,nz=dy/l,
    a=(.95-.5*t)*(.35+.65*flow),b=(.15+.13*t)*flow;
    for(let s=0;s<=NS;s++){const th=s/NS*Math.PI*2,k=(r*(NS+1)+s)*3;sPos[k]=a*Math.cos(th);sPos[k+1]=y+ny*b*Math.sin(th);sPos[k+2]=z+nz*b*Math.sin(th)}}
  sGeo.attributes.position.needsUpdate=true;sGeo.computeVertexNormals()}

/* ---- ouvrier : casque, masque, gilet vert, presse-papiers ---- */
G_worker.position.set(3.45,0,-2.7);G_worker.rotation.y=.5;G_worker.scale.setScalar(1.15);
const skin=M(0x6b4430,{roughness:.55}),shirt=M(0xd9d6cc,{roughness:.8}),pants=M(0x2d3c55,{roughness:.8}),vest=M(0x3fa34d,{roughness:.7}),refl=M(0xdfe3e6,{metalness:.5,roughness:.3,envMapIntensity:1});
[-1,1].forEach(s=>{box(.2,.14,.34,M(0x3b2a1e),s*.12,.07,.04,G_worker);box(.18,.78,.2,pants,s*.12,.53,0,G_worker)});
box(.5,.18,.28,pants,0,1,0,G_worker);
box(.52,.58,.28,vest,0,1.31,0,G_worker);[1.2,1.42].forEach(y=>box(.535,.07,.29,refl,0,y,0,G_worker));
box(.1,.58,.285,refl,-.16,1.31,0,G_worker);box(.1,.58,.285,refl,.16,1.31,0,G_worker);
cyl(.06,.06,.1,12,skin,0,1.64,0,G_worker);
sph(.15,skin,0,1.76,0,G_worker);
const hat=sh(new THREE.Mesh(new THREE.SphereGeometry(.19,24,12,0,Math.PI*2,0,Math.PI/2),M(0xf2c230,{roughness:.35,clearcoat:1})));hat.position.set(0,1.79,0);G_worker.add(hat);
cyl(.2,.2,.025,28,M(0xf2c230,{roughness:.35}),0,1.79,.035,G_worker);box(.05,.03,.38,M(0xf2c230),0,1.98,0,G_worker);
rbox(.23,.12,.1,.04,M(0xf5f7f8,{roughness:.9}),0,1.715,.125,G_worker);
[-1,1].forEach(s=>{sph(.018,M(0x111111),s*.055,1.785,.138,G_worker);box(.01,.07,.02,M(0xf5f7f8),s*.14,1.74,.05,G_worker)});
const arm=s=>{const sh1=new THREE.Group();sh1.position.set(s*.34,1.5,0);sh1.rotation.x=-.7;G_worker.add(sh1);
  box(.15,.34,.15,shirt,0,-.17,0,sh1);const el=new THREE.Group();el.position.set(0,-.34,0);el.rotation.order='YXZ';el.rotation.set(-.9,-s*.5,0);sh1.add(el);
  box(.13,.3,.13,shirt,0,-.15,0,el);sph(.07,skin,0,-.32,0,el)};arm(1);arm(-1);
const cb=new THREE.Group();cb.position.set(0,1.3,.52);cb.rotation.x=-.3;G_worker.add(cb);
rbox(.36,.46,.025,.01,M(0x7a5232,{roughness:.7}),0,0,0,cb);
const paperT=ctex(128,180,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);g.fillStyle='#2E7D5B';g.fillRect(8,8,w-16,16);g.fillStyle='#9aa';for(let y=36;y<h-8;y+=11)g.fillRect(10,y,w-20-rnd()*30,2)});
const paper=new THREE.Mesh(new THREE.PlaneGeometry(.31,.4),new THREE.MeshStandardMaterial({map:paperT,roughness:.9}));paper.position.set(0,-.01,.0145);cb.add(paper);
box(.12,.05,.035,rim,0,.22,.02,cb);

/* ================= animation ================= */
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
let t0=performance.now()/1000,tNow=0,rot=0;
const ANG=.7,TOTAL=16,NET=18450,GROSS=31240;
function timeline(t){
  const u=ease((t-4)/7), tilt=ease((t-2.2)/3.3)*ANG*(t<11.8?1:1-ease((t-11.8)/2.7))+(t>=5.5&&t<11.8?.08*u:0);
  const flow=t<4?0:t<4.8?ease((t-4)/.8):t<11?1:1-ease((t-11)/.8);
  return {u,tilt,flow}}
function apply(t,dt){
  const {u,tilt,flow}=timeline(t);
  bed.rotation.x=-tilt;
  bedRice.scale.set(1,Math.max(.02,1-.97*u),1);bedRice.visible=u<.995;
  const g=Math.max(.05,Math.pow(u,.8));pile.scale.set(.3+1.4*g*.97,1.15*g,.3+.9*g*.97);pile.visible=u>.02;
  stream.visible=flow>.02;if(stream.visible){streamTex.offset.y-=dt*1.8;updStream(.03+1.15*g*.92,flow)}
  scene.updateMatrixWorld(true);
  const A=V(0,1.32,-1.9),B=G_truck.worldToLocal(bed.localToWorld(V(0,-.1,3.0)));
  ramL.visible=ramU.visible=tilt>.06;if(ramL.visible){const Mid=A.clone().lerp(B,.55);link(ramL,A,Mid);link(ramU,Mid,B)}
  const kg=Math.round((GROSS-NET*u)/10)*10, done=t>=TOTAL-1.5;
  drawDisplay(kg,NET,done?'NET':(u>0&&u<1?'DÉCHARGEMENT…':(t<2.2?'STABLE':'EN COURS')));
  lamp.material.color.set(u>0&&u<1?0xffb020:0x35e07a)}
$('bPlay').onclick=()=>{t0=performance.now()/1000};

/* ---------- hotspots ---------- */
const HS=[['Entrepôt beige','Façade + porte à rouleau ouverte',0,5.4,-5.3],['Camion-benne blanc','Benne basculante · vérin hydraulique',0,4.6,3.6],['Riz doré déversé','Cône aplati texturé (pas de particules)',0,1.4,-4.4],['Pont-bascule','Plateforme métallique au sol',1.4,.6,6],['Écran de pesée','Affichage numérique sur pied',SX,3.3,SZ],['Ouvrier de réception','Casque · masque · gilet vert · presse-papiers',3.45,2.4,-2.7]];
const hsEl=$('hs'),hsNodes=HS.map(h=>{const b=document.createElement('button');b.className='hotspot';b.setAttribute('aria-label',h[0]);
  b.innerHTML=`<span class="hr"></span><span class="hd"></span><span class="tip"><b>${h[0]}</b><span>${h[1]}</span></span>`;hsEl.appendChild(b);return b});
$('bAnn').onclick=e=>{const p=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',p);hsNodes.forEach(n=>n.classList.toggle('off',!p))};
$('bRot').onclick=e=>{const p=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',p);controls.autoRotate=p};
$('bRes').onclick=()=>{cam.position.copy(HOME);controls.target.copy(TGT);cam.zoom=1;cam.updateProjectionMatrix()};
$('bPng').onclick=()=>{renderer.render(scene,cam);const c=document.createElement('canvas');c.width=renderer.domElement.width;c.height=renderer.domElement.height;const g=c.getContext('2d');
  const gr=g.createRadialGradient(c.width/2,c.height*.38,0,c.width/2,c.height*.38,c.width*.7);gr.addColorStop(0,'#FBF9F0');gr.addColorStop(1,'#E4DEC7');g.fillStyle=gr;g.fillRect(0,0,c.width,c.height);g.drawImage(renderer.domElement,0,0);
  const a=document.createElement('a');a.download='riceware-etape2.png';a.href=c.toDataURL('image/png');a.click()};
const bar=$('bar');for(let i=0;i<18;i++){const e=document.createElement('i');if(i<2)e.className='a';bar.appendChild(e)}

/* ---------- boucle ---------- */
let last=performance.now()/1000;const tmp=V(0,0,0);
function loop(){requestAnimationFrame(loop);const n=performance.now()/1000,dt=Math.min(.05,n-last);last=n;
  apply(Math.min(TOTAL,n-t0),dt);controls.update();renderer.render(scene,cam);
  HS.forEach((h,i)=>{tmp.set(h[2],h[3],h[4]).project(cam);const nd=hsNodes[i];nd.style.left=((tmp.x+1)/2*innerWidth)+'px';nd.style.top=((1-tmp.y)/2*innerHeight)+'px'})}
loop();setTimeout(()=>$('ld').classList.add('h'),400);
</script>
