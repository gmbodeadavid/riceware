<style>

function plateProfile() {

  const yRimEnd = H_TOTAL;
  const yRimStart = H_TOTAL - (rEnd - R_RIM) * Math.tan(RIM_SLOPE);
  const yWell = H_FOOT + THICKNESS;
  const top = [];
  for (let i = 0; i <= 24; i++) top.push(V((R_WELL * i) / 24, yWell));
  const b0 = V(R_WELL, yWell), b1 = V(R_WELL + 6, yWell), b3 = V(R_RIM, yRimStart);
  const b2 = b3.clone().sub(t8.clone().multiplyScalar(6));

    const t = i / 56, u = 1 - t;

  }
  for (let i = 1; i <= 24; i++) top.push(b3.clone().lerp(V(rEnd, yRimEnd), i / 24));

    const a = top[Math.max(i - 1, 0)], b = top[Math.min(i + 1, top.length - 1)];
    const tangent = b.clone().sub(a).normalize();

  for (let r = 66; r > .5; r -= 2) radii.push(r);

function cameraPointFor(index) {
  return stations[index].position.clone().add(new THREE.Vector3(0, 1.05, 0));
}
function cameraOffsetFor(index) {
  const base = window.innerWidth <= 768 ? 22 : 11.5;
  const scale = (index >= 4 && index <= 6) ? base * 5 : base;
  return new THREE.Vector3(scale * .62, scale * .57, scale * .72);
}
function cameraTransition(index, duration) {

  const endPosition = endTarget.clone().add(cameraOffsetFor(index));
  const intermediates = [];

    const direction = index > currentStep ? 1 : -1;
    for (let i = currentStep + direction; i !== index; i += direction) intermediates.push(cameraPointFor(i));
  }
  const curve = new THREE.CatmullRomCurve3([startTarget, ...intermediates, endTarget], false, 'catmullrom', .15);
  return tween({ duration, ease: Easing.inOutCubic, update: t => {
    const target = curve.getPoint(t);
    const offset = new THREE.Vector3().lerpVectors(startPosition.clone().sub(startTarget), endPosition.clone().sub(endTarget), t);
    controls.target.copy(target);
    camera.position.copy(target).add(offset);
    camera.lookAt(target);

}
function selectStep(index, duration = 900) {

  currentStep = index;
  introRunning = false;
  controls.autoRotate = false;
  updateStepUI();
  cameraTransition(index, duration);
  if (previous >= 0 && previous !== index) {
    const outgoing = stations[previous].model, incoming = stations[index].model;
    incoming.scale.setScalar(.85); setGroupOpacity(incoming, .45);
    tween({ duration, ease: Easing.inOutCubic, update: t => {
      outgoing.scale.setScalar(1 - .12 * t); outgoing.position.y = .22 - .12 * t; setGroupOpacity(outgoing, 1 - .45 * t);
      incoming.scale.setScalar(.85 + .15 * t); incoming.position.y = .22 + .12 * (1 - t); setGroupOpacity(incoming, .45 + .55 * t);
    }, done: () => { outgoing.scale.setScalar(1); outgoing.position.y = .22; setGroupOpacity(outgoing, 1); incoming.scale.setScalar(1); incoming.position.y = .22; setGroupOpacity(incoming, 1); }});
  }
  showHint();
}
function overview() {
  currentStep = -1; freeView = false; controls.enableRotate = false;
  controls.autoRotate = !reducedMotion;
  syncFreeButtons(); updateStepUI();
  const start = camera.position.clone(), targetStart = controls.target.clone();
  const end = overviewCameraPosition();
  tween({ duration: 900, ease: Easing.inOutCubic, update: t => {
    controls.target.lerpVectors(targetStart, new THREE.Vector3(0, 0, 0), t);
    camera.position.lerpVectors(start, end, t); camera.lookAt(controls.target);

function previousStep() { selectStep(currentStep <= 0 ? STEPS.length - 1 : currentStep - 1); }
function nextStep(duration = 900) { selectStep(currentStep < 0 ? 0 : (currentStep + 1) % STEPS.length, duration); }
function setAutoplay(value) {
  autoPlay = value; lastAutoStep = performance.now();
  document.querySelectorAll('#btn-auto-dt, #btn-auto-mb').forEach(button => {
    button.setAttribute('aria-pressed', String(value));
    button.setAttribute('aria-label', value ? 'Désactiver la lecture automatique' : 'Activer la lecture automatique');

}
function toggleAutoplay() { setAutoplay(!autoPlay); if (autoPlay && currentStep < 0) selectStep(0, 300); }
function toggleFreeView() {
  freeView = !freeView; controls.enableRotate = freeView; controls.autoRotate = false;
  syncFreeButtons(); showHint();
}
function syncFreeButtons() {
  document.querySelectorAll('#btn-free-dt, #btn-free-mb').forEach(button => {
    button.setAttribute('aria-pressed', String(freeView));
    button.setAttribute('aria-label', freeView ? 'Désactiver la vue libre' : 'Activer la vue libre');
  });
}
function showHint() {
  lastPointerActivity = performance.now(); $('hint').classList.remove('faded');
  clearTimeout(hintTimer); hintTimer = window.setTimeout(() => $('hint').classList.add('faded'), 6000);
}
function buildInterface() {
  const bar = $('progress-bar');
  STEPS.forEach((step, index) => {
    const button = document.createElement('button');
    button.type = 'button'; button.className = 'step-seg'; button.style.setProperty('--step-color', CSS_COLOR[step.color]);
    button.setAttribute('aria-label', step.name); button.title = step.name;
    button.addEventListener('click', () => selectStep(index, 900));
    bar.appendChild(button); progressButtons.push(button); hotspots.push(createHotspot(index));
  });
  updateStepUI();
  const bind = (id, action) => $(id).addEventListener('click', action);
  bind('btn-prev-dt', previousStep); bind('btn-prev-mb', previousStep);
  bind('btn-next-dt', () => nextStep()); bind('btn-next-mb', () => nextStep());
  bind('btn-auto-dt', toggleAutoplay); bind('btn-auto-mb', toggleAutoplay);
  bind('btn-free-dt', toggleFreeView); bind('btn-free-mb', toggleFreeView);
  bind('btn-reset-dt', overview); bind('btn-reset-mb', overview);
  window.addEventListener('keydown', event => {
    if (event.target instanceof HTMLElement && ['BUTTON', 'INPUT', 'TEXTAREA'].includes(event.target.tagName)) return;
    if (event.key === 'ArrowRight') { event.preventDefault(); nextStep(); }
    else if (event.key === 'ArrowLeft') { event.preventDefault(); previousStep(); }
    else if (event.key.toLowerCase() === 'r') { event.preventDefault(); overview(); }
    else if (event.key === ' ') { event.preventDefault(); toggleAutoplay(); }
  });
  ['pointerdown', 'pointermove', 'wheel', 'keydown'].forEach(eventName => window.addEventListener(eventName, showHint, { passive: true }));
}

// Les médaillons restent dans la scène après le refroidissement, puis s’enrichissent à chaque poste.
function addMedallion(stageIndex, stationModel) {
  const set = PRODUCT_SETS[stageIndex]; if (!set) return null;
  const pedestal = new THREE.Group(); pedestal.position.set(1.12, .27, 1.08); stationModel.add(pedestal);
  cylinder(pedestal, .96, .96, .14, MAT.concrete, [0, 0, 0], 12);
  cylinder(pedestal, .88, .88, .035, MAT.husk, [0, .09, 0], 12);
  const products = new THREE.Group(); products.position.y = .12; pedestal.add(products);
  set.forEach((name, index) => {
    const x = set.length === 1 ? 0 : (index - (set.length - 1) / 2) * .32;
    const z = set.length > 3 ? (index % 2 ? .22 : -.22) : 0;
    const scale = set.length > 3 ? 1.7 : set.length > 1 ? 2.35 : 3.2;
    makeProduct(name, products, MAT.panel, [x, .06, z], scale);
  });
  return pedestal;
}
const PRODUCT_SETS = {
  11: ['assiette'], 12: ['gobelet', 'fourchette'], 13: ['cuillere'],
  14: ['assiette', 'gobelet', 'fourchette'], 15: ['boite'],
  16: ['assiette', 'gobelet', 'fourchette', 'cuillere', 'boite'],
  17: ['assiette', 'gobelet', 'fourchette', 'cuillere', 'boite']
};

async function generateTextures() {
  const bar = $('loader-bar');
  const recipes = [
    ['husk', PALETTE.husk, 'husk'], ['powder', PALETTE.powder, 'powder'],
    ['panel', PALETTE.panel, 'powder'], ['steel', PALETTE.steel, 'steel'],
    ['concrete', PALETTE.concrete, 'concrete'], ['wood', PALETTE.wood, 'wood'],
    ['amber', PALETTE.amber, 'powder'], ['teal', PALETTE.teal, 'steel'],
    ['green', PALETTE.green, 'concrete'], ['paper', PALETTE.paper, 'paper'],
    ['ink', PALETTE.ink, 'steel'], ['kraft', 0xB7895F, 'wood'], ['hot', 0xF36A22, 'steel']
  ];
  const total = recipes.length;
  recipes.forEach(([key, color, style], index) => {
    const seed = 731 + index * 97;
    MAT[key] = makeMaterial(color, seed, style, key === 'hot' ? { emissive: 0x9A2300, emissiveIntensity: .5, roughness: .3, metalness: .28 } : {});
    bar.style.width = `${Math.round((index + 1) / total * 65)}%`;
  });
  floorShadowTexture = makeShadowTexture();
  for (let i = 0; i < STEPS.length; i++) {
    stations.push(createStation(i));
    bar.style.width = `${65 + Math.round((i + 1) / STEPS.length * 35)}%`;
    if (i % 4 === 3) await new Promise(resolve => requestAnimationFrame(resolve));
  }
}

function createScene() {
  scene = new THREE.Scene(); scene.background = new THREE.Color(PALETTE.bg);
  camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, .1, 250);
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  $('canvas-container').appendChild(renderer.domElement);

  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  roomEnv = pmrem.fromScene(new RoomEnvironment(), .04).texture;
  scene.environment = roomEnv;
  const ambient = new THREE.AmbientLight(0xffffff, .52); scene.add(ambient);
  const key = new THREE.DirectionalLight(0xFFF4D9, 2.2);
  key.position.set(-18, 27, 20); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -32; key.shadow.camera.right = 32;
  key.shadow.camera.top = 24; key.shadow.camera.bottom = -24; key.shadow.bias = -.00045;
  scene.add(key);
  spotlight = new THREE.SpotLight(0xFFF1CE, 2.1, 44, Math.PI / 5, .55, 1.5);
  spotlight.position.set(-24, 13, -8); spotlight.castShadow = false; scene.add(spotlight); scene.add(spotlight.target);
  sceneRoot = new THREE.Group(); scene.add(sceneRoot);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(150, 70), new THREE.MeshStandardMaterial({ color: 0xEDE8D6, roughness: 1, metalness: 0 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -.035; floor.receiveShadow = true; scene.add(floor);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = .075; controls.enablePan = false; controls.enableZoom = true;
  controls.enableRotate = false; controls.autoRotate = false; controls.autoRotateSpeed = .65;
  controls.minDistance = 2.0; controls.maxDistance = 22; controls.maxPolarAngle = Math.PI / 2 - .03;
  controls.target.set(0, 0, 0);
  window.addEventListener('resize', resizeRenderer);
}
function resizeRenderer() {
  if (!renderer || !camera) return;
  const previousAspect = camera.aspect;
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (currentStep < 0 && previousAspect !== camera.aspect) camera.position.copy(overviewCameraPosition());
  updateHotspots();
}
function overviewCameraPosition() {
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  const distance = Math.max(24 / Math.tan(hfov / 2), 7.2 / Math.tan(vfov / 2), 40) * 1.13;
  return new THREE.Vector3(.46, .68, .57).normalize().multiplyScalar(distance);
}
function startIntro() {
  introRunning = true;
  const mobile = window.matchMedia('(max-width: 768px)').matches;
  if (mobile) { currentStep = 0; updateStepUI(); }
  const target = mobile ? cameraPointFor(0) : new THREE.Vector3(0, 0, 0);
  controls.target.copy(target);
  const start = mobile ? target.clone().add(cameraOffsetFor(0).multiplyScalar(1.3)) : overviewCameraPosition();
  const end = start.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 2);
  camera.position.copy(start); camera.lookAt(target);
  if (reducedMotion) {
    camera.position.copy(mobile ? target.clone().add(cameraOffsetFor(0)) : overviewCameraPosition());
    camera.lookAt(target); controls.autoRotate = false; introRunning = false;
    $('loader').classList.add('hidden'); return;
  }
  tween({ duration: 2500, ease: Easing.inOutCubic, update: t => {
    const orbit = start.clone().lerp(end, t);
    camera.position.copy(orbit); camera.lookAt(target);
    spotlight.position.set(-24 + t * 48, 13, -8 + Math.sin(t * Math.PI) * 16);
    spotlight.target.position.set(-20 + t * 40, .5, mobile ? 0 : -4.6);
  }, done: () => {
    introRunning = false;
    if (mobile) { camera.position.copy(target.clone().add(cameraOffsetFor(0))); camera.lookAt(target); }
    else { controls.autoRotate = true; }

  }});
}
function updateScene(now) {
  const seconds = now * .001;
  stations.forEach((station, index) => {
    station.animation.moving.forEach(update => update(seconds));
    if (station.animation.medallion) station.animation.medallion.rotation.y = seconds * .18;
  });
  if (spotlight && introRunning) {
    spotlight.position.x = -22 + ((seconds * 8) % 44);
    spotlight.target.position.set(spotlight.position.x * .45, .4, Math.sin(seconds * 1.5) * 6);
  }
  if (autoPlay && !introRunning && now - lastAutoStep > 6000) {
    lastAutoStep = now; selectStep(currentStep < 0 ? 0 : (currentStep + 1) % STEPS.length, 300);
  }
  runTweens(now);
}
function animate(now) {
  if (!renderer || !scene || !camera) return;
  updateScene(now); controls.update(); updateHotspots(); renderer.render(scene, camera);
}
function syncLoop() {
  const shouldRun = pageVisible && inViewport && !!renderer;
  if (shouldRun && !loopRunning) { renderer.setAnimationLoop(animate); loopRunning = true; }
  else if (!shouldRun && loopRunning) { renderer.setAnimationLoop(null); loopRunning = false; }
}
function bindVisibility() {
  document.addEventListener('visibilitychange', () => { pageVisible = !document.hidden; syncLoop(); });
  const observer = new IntersectionObserver(entries => { inViewport = entries.some(entry => entry.isIntersecting); syncLoop(); }, { threshold: .01 });
  observer.observe($('canvas-container'));
}
function buildUI() {
  const progress = $('progress-bar');
  STEPS.forEach((step, index) => {
    const button = document.createElement('button'); button.type = 'button'; button.className = 'step-seg';
    button.style.setProperty('--step-color', CSS_COLOR[step.color]); button.setAttribute('aria-label', step.name); button.title = step.name;
    button.addEventListener('click', () => selectStep(index, 900)); progress.appendChild(button);
    progressButtons.push(button); hotspots.push(createHotspot(index));
  });
  updateStepUI();
  const bind = (id, callback) => $(id).addEventListener('click', callback);
  bind('btn-prev-dt', previousStep); bind('btn-prev-mb', previousStep);
  bind('btn-next-dt', () => nextStep(900)); bind('btn-next-mb', () => nextStep(900));
  bind('btn-auto-dt', toggleAutoplay); bind('btn-auto-mb', toggleAutoplay);
  bind('btn-free-dt', toggleFreeView); bind('btn-free-mb', toggleFreeView);
  bind('btn-reset-dt', overview); bind('btn-reset-mb', overview);
  window.addEventListener('keydown', event => {
    if (event.target instanceof HTMLElement && ['BUTTON', 'INPUT', 'TEXTAREA'].includes(event.target.tagName)) return;
    if (event.key === 'ArrowRight') { event.preventDefault(); nextStep(900); }
    else if (event.key === 'ArrowLeft') { event.preventDefault(); previousStep(); }
    else if (event.key.toLowerCase() === 'r') { event.preventDefault(); overview(); }
    else if (event.key === ' ') { event.preventDefault(); toggleAutoplay(); }
  });

}
async function init() {
  try {
    const testCanvas = document.createElement('canvas');
    const gl = testCanvas.getContext('webgl2') || testCanvas.getContext('webgl');
    if (!window.WebGLRenderingContext || !gl) throw new Error('WebGL');
    buildInterface(); createScene(); await generateTextures();
    progressButtons.forEach(button => button.setAttribute('aria-disabled', 'false'));
    showHint();
    startIntro(); bindVisibility();
    $('loader-bar').style.width = '100%';
    syncLoop();
  } catch (error) {
    $('loader').classList.add('hidden'); $('webgl-error').style.display = 'flex';
    console.error(error);
  }
}

init();
</script>
