<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assiette plate — RiceWare CI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#f4f1e4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
canvas{display:block}
#ui{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:10px;padding:16px;pointer-events:none}
.btn{pointer-events:all;display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:999px;border:none;background:rgba(255,253,246,.92);color:#1c2a20;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(28,42,32,.15);transition:box-shadow .15s,transform .15s,background .15s,color .15s}
.btn:hover{box-shadow:0 4px 16px rgba(28,42,32,.22);transform:translateY(-1px)}
.btn.active{background:#2f6b43;color:#fffdf6}
#label{position:fixed;top:20px;left:24px;pointer-events:none}
#label h1{font-size:22px;font-weight:700;color:#1c2a20;line-height:1.2}
#label p{font-size:12px;color:#5a6456;margin-top:3px;font-family:monospace}
#badge{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:999px;background:#f8ecc2;color:#7f610a;font-size:10px;font-family:monospace;font-weight:600;letter-spacing:.04em}
</style>
</head>
<body>
<div id="label">
  <h1>Assiette plate</h1>
  <p>Ø 260 mm · ép. 2,4 mm</p>
  <span id="badge">Rendu 3D conceptuel</span>
</div>
<div id="ui">
  <button class="btn active" data-opt="perspective">⬡ Perspective</button>
  <button class="btn" data-opt="top">↑ Dessus</button>
  <button class="btn" data-opt="profile">◐ Profil</button>
  <button class="btn" data-opt="bottom">↓ Dessous</button>
  <button class="btn" data-opt="stack">⊞ Empilée</button>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';

const lerp=(a,b,t)=>a+(b-a)*t;
const inOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
class Tweens{constructor(){this.items=new Set}add(o){const tw={start:performance.now(),duration:o.duration,ease:o.ease??inOutCubic,update:o.update};this.items.add(tw);return tw}cancel(tw){if(tw)this.items.delete(tw)}run(now){for(const tw of this.items){if(now<tw.start)continue;const t=tw.duration<=0?1:Math.min((now-tw.start)/tw.duration,1);tw.update(tw.ease(t));if(t>=1)this.items.delete(tw)}}}
const tweens=new Tweens();

// ── Biocomposite texture ──────────────────────────────────────────────────────
function mulberry32(seed){let a=seed;return()=>{a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function drawBiocomposite(size){const rnd=mulberry32(2025);const cc=document.createElement('canvas'),hc=document.createElement('canvas');cc.width=cc.height=hc.width=hc.height=size;const c=cc.getContext('2d'),h=hc.getContext('2d');c.fillStyle='#D9B77A';c.fillRect(0,0,size,size);h.fillStyle='#7f7f7f';h.fillRect(0,0,size,size);const wrap=(x,y,m,fn)=>{for(const dx of[-size,0,size])for(const dy of[-size,0,size]){const X=x+dx,Y=y+dy;if(X>-m&&X<size+m&&Y>-m&&Y<size+m)fn(X,Y)}};for(let i=0;i<70;i++){const x=rnd()*size,y=rnd()*size,r=50+rnd()*140,l=rnd()>.5;wrap(x,y,r,(X,Y)=>{const g=c.createRadialGradient(X,Y,0,X,Y,r);g.addColorStop(0,l?'rgba(238,210,155,.14)':'rgba(170,130,75,.11)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(X-r,Y-r,r*2,r*2)})}for(let i=0;i<6000;i++){const x=rnd()*size,y=rnd()*size,r=.3+rnd()*1.2,l=rnd()>.5;wrap(x,y,3,(X,Y)=>{c.fillStyle=l?'#E8C98A':'#C09A63';c.beginPath();c.arc(X,Y,r,0,Math.PI*2);c.fill();h.fillStyle=l?'#9a9a9a':'#666';h.beginPath();h.arc(X,Y,r,0,Math.PI*2);h.fill()})}c.lineCap='round';h.lineCap='round';for(let i=0;i<800;i++){const x=rnd()*size,y=rnd()*size,len=5+rnd()*18,ang=rnd()*Math.PI*2,lw=1+rnd()*2.5,l=rnd()>.5,ex=Math.cos(ang)*len,ey=Math.sin(ang)*len;wrap(x,y,len+4,(X,Y)=>{c.globalAlpha=.85;c.strokeStyle=l?'#E8C98A':'#B8914F';c.lineWidth=lw;c.beginPath();c.moveTo(X,Y);c.lineTo(X+ex,Y+ey);c.stroke();c.globalAlpha=1;h.strokeStyle=l?'#d0d0d0':'#b0b0b0';h.lineWidth=lw;h.beginPath();h.moveTo(X,Y);h.lineTo(X+ex,Y+ey);h.stroke()})}for(let i=0;i<300;i++){const x=rnd()*size,y=rnd()*size,rx=.8+rnd()*2,ry=.5+rnd(),ang=rnd()*Math.PI;wrap(x,y,5,(X,Y)=>{c.fillStyle='#6B4E2A';c.beginPath();c.ellipse(X,Y,rx,ry,ang,0,Math.PI*2);c.fill();h.fillStyle='#4a4a4a';h.beginPath();h.ellipse(X,Y,rx,ry,ang,0,Math.PI*2);h.fill()})}return{color:cc,height:hc}}
function heightToNormal(src,strength){const size=src.width,ctx=src.getContext('2d'),pixels=ctx.getImageData(0,0,size,size).data,hs=new Float32Array(size*size);for(let i=0;i<size*size;i++)hs[i]=pixels[i*4]/255;const out=document.createElement('canvas');out.width=out.height=size;const oc=out.getContext('2d'),img=oc.createImageData(size,size),d=img.data;for(let y=0;y<size;y++){const up=((y-1+size)%size)*size,dn=((y+1)%size)*size,row=y*size;for(let x=0;x<size;x++){const l=(x-1+size)%size,r=(x+1)%size,dx=(hs[row+r]-hs[row+l])*strength,dy=(hs[dn+x]-hs[up+x])*strength,inv=1/Math.hypot(dx,dy,1),i=(row+x)*4;d[i]=(-dx*inv*.5+.5)*255;d[i+1]=(dy*inv*.5+.5)*255;d[i+2]=(inv*.5+.5)*255;d[i+3]=255}}oc.putImageData(img,0,0);return out}
function createMaps(renderer){const{color,height}=drawBiocomposite(1024);const setup=(tex,srgb)=>{tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();if(srgb)tex.colorSpace=THREE.SRGBColorSpace;return tex};return{map:setup(new THREE.CanvasTexture(color),true),normalMap:setup(new THREE.CanvasTexture(heightToNormal(height,2.5)),false)}}
function bioMat(maps,ns=0.45,ds=false){return new THREE.MeshStandardMaterial({color:0xffffff,map:maps.map,normalMap:maps.normalMap,normalScale:new THREE.Vector2(ns,ns),roughness:.92,metalness:0,side:ds?THREE.DoubleSide:THREE.FrontSide})}

// ── Plate geometry (millimetres → metres) ─────────────────────────────────────
// All constants in millimetres; plateProfile() multiplies by 0.001 at the end.
const R_WELL=85,R_RIM=100,R_OUT=115,H_TOTAL=20,THICKNESS=2.5;
const RIM_SLOPE=THREE.MathUtils.degToRad(8);
const H_FOOT=2,R_FOOT=70,SEGMENTS=160,TILE=0.18;
const STACK_STEP=0.006,FLIP_LIFT=0.03,PIVOT=H_TOTAL/2000;
const hiddenY=k=>k*STACK_STEP+0.12+k*0.05;

function plateProfile(){
  const V=(x,y)=>new THREE.Vector2(x,y);
  const t8=V(Math.cos(RIM_SLOPE),Math.sin(RIM_SLOPE));
  const rEnd=R_OUT-THICKNESS/2;
  const yRimEnd=H_TOTAL;
  const yRimStart=H_TOTAL-(rEnd-R_RIM)*Math.tan(RIM_SLOPE);
  const yWell=H_FOOT+THICKNESS;

  // Top surface: flat well → bezier curve → straight rim
  const top=[];
  for(let i=0;i<=24;i++) top.push(V((R_WELL*i)/24,yWell));
  const b0=V(R_WELL,yWell),b1=V(R_WELL+6,yWell);
  const b3=V(R_RIM,yRimStart),b2=b3.clone().sub(t8.clone().multiplyScalar(6));
  for(let i=1;i<=56;i++){
    const t=i/56,u=1-t;
    top.push(V(u*u*u*b0.x+3*u*u*t*b1.x+3*u*t*t*b2.x+t*t*t*b3.x,
               u*u*u*b0.y+3*u*u*t*b1.y+3*u*t*t*b2.y+t*t*t*b3.y));
  }
  for(let i=1;i<=24;i++) top.push(b3.clone().lerp(V(rEnd,yRimEnd),i/24));

  // Per-vertex normals for offset calculation
  const normals=top.map((_,i)=>{
    const a=top[Math.max(i-1,0)],b=top[Math.min(i+1,top.length-1)];
    const tang=b.clone().sub(a).normalize();
    return V(-tang.y,tang.x);
  });

  const pts=[...top];

  // Rolled rim (semi-circle arc)
  const pEnd=top[top.length-1],nEnd=normals[normals.length-1];
  const tEnd=V(nEnd.y,-nEnd.x);
  const center=pEnd.clone().sub(nEnd.clone().multiplyScalar(THICKNESS/2));
  for(let k=1;k<20;k++){
    const theta=(Math.PI*k)/20;
    pts.push(center.clone()
      .add(nEnd.clone().multiplyScalar((Math.cos(theta)*THICKNESS)/2))
      .add(tEnd.clone().multiplyScalar((Math.sin(theta)*THICKNESS)/2)));
  }

  // Underside (offset inward by thickness)
  for(let i=top.length-1;i>=25;i--)
    pts.push(top[i].clone().sub(normals[i].clone().multiplyScalar(THICKNESS)));

  // Underside centre with foot ring bump
  const foot=r=>{
    const u=Math.abs(r-R_FOOT);
    if(u<=0.9) return 1;
    if(u<2.4) return 0.5+0.5*Math.cos((Math.PI*(u-0.9))/1.5);
    return 0;
  };
  const radii=[];
  for(let r=R_WELL-1;r>74;r-=1) radii.push(r);
  for(let r=74;r>66;r-=0.2) radii.push(r);
  for(let r=66;r>0.5;r-=2) radii.push(r);
  radii.push(0);
  for(const r of radii) pts.push(V(r,H_FOOT-H_FOOT*foot(r)));

  // Convert mm → m
  return pts.map(p=>p.multiplyScalar(0.001));
}

function makePlateGeo(){
  const geo=new THREE.LatheGeometry(plateProfile(),SEGMENTS);
  // Write UVs based on XZ world position BEFORE toCreasedNormals changes vertex count
  const pos=geo.attributes.position,uv=geo.attributes.uv;
  for(let i=0;i<pos.count;i++) uv.setXY(i,pos.getX(i)/TILE,pos.getZ(i)/TILE);
  uv.needsUpdate=true;
  return toCreasedNormals(geo,THREE.MathUtils.degToRad(40));
}

// ── Scene ─────────────────────────────────────────────────────────────────────
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf4f1e4);
const maps=createMaps(renderer);
const plateGeo=makePlateGeo();
const mat=bioMat(maps,0.45,true);

const group=new THREE.Group();
scene.add(group);
const flipGroup=new THREE.Group();
flipGroup.position.y=PIVOT;
group.add(flipGroup);
const plate=new THREE.Mesh(plateGeo,mat);
plate.position.y=-PIVOT;
plate.castShadow=plate.receiveShadow=true;
flipGroup.add(plate);

const extras=[1,2].map(k=>{
  const h=new THREE.Group(),m=new THREE.Mesh(plateGeo,mat);
  m.castShadow=m.receiveShadow=true;
  h.add(m);h.visible=false;h.scale.setScalar(0.001);
  h.position.y=hiddenY(k);
  group.add(h);
  return h;
});

// Floor shadow
const sp=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.ShadowMaterial({opacity:.18}));
sp.rotation.x=-Math.PI/2;sp.receiveShadow=true;scene.add(sp);
// Lights
scene.add(new THREE.AmbientLight(0xfff8e8,0.8));
const sun=new THREE.DirectionalLight(0xfff5d6,2.2);
sun.position.set(1.5,3,2);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=sun.shadow.camera.bottom=-0.3;
sun.shadow.camera.right=sun.shadow.camera.top=0.3;
scene.add(sun);
scene.add(Object.assign(new THREE.DirectionalLight(0xd4e8ff,0.5),{position:new THREE.Vector3(-1,1,-1)}));

// ── Camera ────────────────────────────────────────────────────────────────────
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.01,20);
// Perspective dir: azimuth 30°, elevation 35°
const perspDir=new THREE.Vector3(
  Math.sin(THREE.MathUtils.degToRad(30))*Math.cos(THREE.MathUtils.degToRad(35)),
  Math.sin(THREE.MathUtils.degToRad(35)),
  Math.cos(THREE.MathUtils.degToRad(30))*Math.cos(THREE.MathUtils.degToRad(35))
).normalize();
const DIRS={
  perspective:perspDir,
  top:new THREE.Vector3(0,1,0.02).normalize(),
  profile:new THREE.Vector3(0,0.12,1).normalize(),
  bottom:new THREE.Vector3(0,-1,0.02).normalize(),
  stack:perspDir
};

// Plate is Ø 230 mm, 20 mm tall. Centre at y≈0.010 m.
// radius=0.35 keeps the full plate in the 38° FOV.
let theta=Math.atan2(perspDir.x,perspDir.z);
let phi=Math.acos(perspDir.y);
let radius=0.35;
let running=null;
const target=new THREE.Vector3(0,0.010,0);
const state={flip:0,stack:0};

function render3d(){
  const lift=FLIP_LIFT*Math.sin(Math.PI*state.flip);
  flipGroup.rotation.x=Math.PI*state.flip;
  flipGroup.position.y=PIVOT+lift;
  extras.forEach((h,i)=>{
    const k=i+1;
    h.position.y=lerp(hiddenY(k),k*STACK_STEP,state.stack);
    h.scale.setScalar(Math.max(0.001,Math.min(1,state.stack*2.5)));
    h.visible=state.stack>0.002;
  });
}

function setDir(dir,r,tgt,animate){
  const to=dir.clone().normalize();
  const tt=Math.atan2(to.x,to.z),tp=Math.acos(Math.max(-1,Math.min(1,to.y)));
  tweens.cancel(running);
  if(!animate){theta=tt;phi=tp;radius=r;target.copy(tgt);return;}
  const ft=theta,fp=phi,fr=radius,ftgt=target.clone();
  running=tweens.add({duration:700,update:t=>{
    theta=lerp(ft,tt,t);phi=lerp(fp,tp,t);radius=lerp(fr,r,t);
    target.lerpVectors(ftgt,tgt,t);
  }});
}

function applyOpt(opt,animate){
  const dir=DIRS[opt]??DIRS.perspective;
  const r=opt==='stack'?0.42:0.35;
  const tgt=new THREE.Vector3(0,opt==='stack'?0.015:0.010,0);
  setDir(dir,r,tgt,animate);
  const to={flip:opt==='bottom'?1:0,stack:opt==='stack'?1:0};
  if(!animate){Object.assign(state,to);render3d();return;}
  const from={...state};
  tweens.add({duration:900,update:t=>{
    state.flip=lerp(from.flip,to.flip,t);
    state.stack=lerp(from.stack,to.stack,t);
    render3d();
  }});
}
applyOpt('perspective',false);

function updateCam(){
  const x=target.x+radius*Math.sin(phi)*Math.sin(theta);
  const y=target.y+radius*Math.cos(phi);
  const z=target.z+radius*Math.sin(phi)*Math.cos(theta);
  camera.position.set(x,y,z);
  camera.lookAt(target);
}

// Orbit
let drag=false,lx=0,ly=0;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;theta-=(e.clientX-lx)*0.007;phi=Math.max(0.05,Math.min(Math.PI,phi+(e.clientY-ly)*0.007));lx=e.clientX;ly=e.clientY});
renderer.domElement.addEventListener('pointerup',()=>drag=false);
renderer.domElement.addEventListener('wheel',e=>{radius=Math.max(0.10,Math.min(0.70,radius+e.deltaY*0.0002));},{passive:true});

document.querySelectorAll('.btn').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyOpt(btn.dataset.opt,true);
}));
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});

(function loop(now=0){requestAnimationFrame(loop);tweens.run(now);updateCam();renderer.render(scene,camera)})(0);
</script>
</body>
</html>
